<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Korsan Dünyası 2D</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #073b59; color: #fff; font-family: system-ui, -apple-system, sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

    #hud {
      position: fixed; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.85);
    }
    .panel {
      background: rgba(0, 30, 48, 0.84); backdrop-filter: blur(4px);
      padding: 10px 14px; border-radius: 12px; font-size: 13px;
      border: 1px solid rgba(255,255,255,0.16); min-width: 235px;
      pointer-events: auto;
    }
    .hud-top-row {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .logout-chip {
      border: 1px solid rgba(255, 215, 131, 0.45);
      background: rgba(143, 45, 20, 0.72);
      color: #ffd783;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      cursor: pointer;
    }
    .logout-chip:hover {
      background: rgba(185, 58, 26, 0.9);
    }
    .stat-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; margin-top: 6px; gap: 8px;
    }
    .bar-bg {
      width: 100%; height: 9px; background: rgba(255,255,255,0.18);
      border-radius: 5px; margin-top: 4px; overflow: hidden;
    }
    #hp-bar {
      width: 100%; height: 100%; background: #4ade80; transition: width 0.2s, background 0.2s;
    }
    #exp-bar {
      width: 0%; height: 100%; background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 0.25s ease;
    }
    #regen-info {
      font-size: 11px; color: #bae6fd; margin-top: 5px; min-height: 14px;
    }
    #minimap {
      width: 92px; height: 92px; border-radius: 50%;
      background: rgba(0, 24, 38, 0.88); border: 2px solid rgba(233, 211, 161, 0.55);
      flex-shrink: 0;
    }
    #hint {
      position: fixed; top: 132px; left: 12px; font-size: 12px;
      background: rgba(0, 30, 48, 0.72); padding: 6px 10px; border-radius: 8px;
      pointer-events: none; max-width: 72vw;
    }

    #combat-bar {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      z-index: 6; display: flex; gap: 10px; align-items: center;
    }
    #attack-btn {
      min-width: 170px; height: 52px; padding: 0 24px;
      border-radius: 999px; border: 2px solid rgba(255,255,255,0.25);
      background: rgba(15, 35, 50, 0.75); color: rgba(255,255,255,0.4);
      font-size: 15px; font-weight: 800; letter-spacing: 0.6px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45);
      cursor: not-allowed; transition: all 0.16s ease;
      touch-action: manipulation;
    }
    #attack-btn.active {
      border-color: #ffd783;
      background: linear-gradient(180deg, #c24929, #8f2d14);
      color: #fff;
      cursor: pointer;
    }
    #attack-btn.active:active { transform: scale(0.96); }
    #attack-btn.firing {
      border-color: #fda4af;
      background: linear-gradient(180deg, #dc2626, #7f1d1d);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(239, 68, 68, 0.6);
    }

    #gameover {
      display: none; position: fixed; inset: 0; background: rgba(0, 18, 28, 0.86);
      flex-direction: column; align-items: center; justify-content: center; z-index: 12;
      text-align: center; padding: 20px;
    }
    #gameover h1 { color: #ffd783; margin: 0 0 10px; font-size: 32px; }
    #gameover p { font-size: 16px; margin: 0 0 24px; color: #cbd5e1; }
    #restart-btn {
      padding: 12px 28px; font-size: 16px; font-weight: bold; border-radius: 12px;
      border: 2px solid #ffd783; background: #a33d22; color: white; cursor: pointer;
    }

    /* Giriş ve Kayıt Ol Ekranı */
    #auth-overlay {
      position: fixed; inset: 0; z-index: 20;
      background: radial-gradient(circle at top, rgba(8, 125, 160, 0.55), rgba(3, 21, 34, 0.92));
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      padding: 18px;
      user-select: text; -webkit-user-select: text;
    }
    .auth-card {
      width: 100%; max-width: 400px;
      background: rgba(5, 29, 45, 0.94);
      border: 1px solid rgba(255, 215, 131, 0.35);
      border-radius: 18px;
      padding: 24px 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 18px;
    }
    .auth-brand h1 {
      margin: 0;
      font-size: 24px;
      color: #ffd783;
      letter-spacing: 0.4px;
    }
    .auth-brand p {
      margin: 6px 0 0;
      font-size: 12px;
      color: #94a3b8;
    }
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .auth-tab {
      border: none;
      background: transparent;
      color: #cbd5e1;
      padding: 9px 10px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .auth-tab.active {
      background: linear-gradient(180deg, #c24929, #8f2d14);
      color: #fff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
    }
    .auth-field {
      margin-bottom: 12px;
    }
    .auth-field label {
      display: block;
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 5px;
      font-weight: 600;
    }
    .auth-field input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(15, 43, 64, 0.88);
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .auth-field input:focus {
      border-color: #ffd783;
    }
    .auth-msg {
      min-height: 18px;
      font-size: 12px;
      margin: 4px 0 12px;
      color: #fca5a5;
    }
    .auth-msg.ok {
      color: #4ade80;
    }
    .auth-submit {
      width: 100%;
      height: 44px;
      border-radius: 12px;
      border: 1px solid #ffd783;
      background: linear-gradient(180deg, #c24929, #8f2d14);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.4px;
      cursor: pointer;
    }
    .auth-submit:hover {
      filter: brightness(1.08);
    }
    .quick-test-box {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #bae6fd;
    }
    .quick-test-btn {
      border: 1px solid rgba(186, 230, 253, 0.35);
      background: rgba(14, 116, 144, 0.35);
      color: #e0f2fe;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <canvas id="game"></canvas>

  <div id="hud">
    <div class="panel">
      <div class="hud-top-row">
        <strong id="ship-title">Kara İnci</strong>
        <button id="logout-btn" class="logout-chip" title="Oturumu Kapat">Çıkış</button>
      </div>
      <div class="stat-row" style="margin-top:4px;">
        <span>Kaptan: <strong id="captain-name">Test</strong></span>
        <span>Sv. <strong id="level">1</strong> · Altın: <strong id="score">0</strong></span>
      </div>
      <div class="stat-row">
        <span>Can</span>
        <span id="hp-text">1000 / 1000</span>
      </div>
      <div class="bar-bg"><div id="hp-bar"></div></div>
      <div class="stat-row">
        <span>EXP</span>
        <span id="exp-text">0 / 100</span>
      </div>
      <div class="bar-bg"><div id="exp-bar"></div></div>
      <div id="regen-info"></div>
    </div>
    <canvas id="minimap" width="92" height="92"></canvas>
  </div>

  <div id="hint">Denize tek tıkla: Yelken aç · Düşmana 1 tık: Seç · 2 tık: Saldır</div>

  <div id="combat-bar">
    <button id="attack-btn" disabled>SALDIR</button>
  </div>

  <div id="gameover">
    <h1>GEMİN BATTI!</h1>
    <p id="final-score">Toplanan Altın: 0</p>
    <button id="restart-btn">YENİDEN YELKEN AÇ</button>
  </div>

  <!-- Giriş ve Kayıt Ol Modalı -->
  <div id="auth-overlay">
    <div class="auth-card">
      <div class="auth-brand">
        <h1>⚓ Korsan Dünyası 2D</h1>
        <p>Çok oyunculu denizler için gemi kaptan hesabınla giriş yap</p>
      </div>

      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab active" type="button">Giriş Yap</button>
        <button id="tab-register" class="auth-tab" type="button">Kayıt Ol</button>
      </div>

      <form id="auth-form">
        <div class="auth-field">
          <label for="auth-username">Gemi Kullanıcı İsmi</label>
          <input id="auth-username" type="text" autocomplete="username" placeholder="Örn: Test" required>
        </div>
        <div class="auth-field">
          <label for="auth-password">Şifre</label>
          <input id="auth-password" type="password" autocomplete="current-password" placeholder="Şifreniz" required>
        </div>
        <div id="auth-msg" class="auth-msg"></div>
        <button id="auth-submit" class="auth-submit" type="submit">Denize Açıl</button>
      </form>

      <div class="quick-test-box">
        <span>Test Hesabı: <strong>Test</strong> / <strong>test</strong></span>
        <button id="fill-test-btn" class="quick-test-btn" type="button">Hızlı Doldur</button>
      </div>
    </div>
  </div>

<script>
const canvas = document.querySelector('#game');
const ctx = canvas.getContext('2d');
const miniCanvas = document.querySelector('#minimap');
const mctx = miniCanvas.getContext('2d');

const scoreEl = document.querySelector('#score');
const levelEl = document.querySelector('#level');
const hpTextEl = document.querySelector('#hp-text');
const expTextEl = document.querySelector('#exp-text');
const hpBarEl = document.querySelector('#hp-bar');
const expBarEl = document.querySelector('#exp-bar');
const regenInfoEl = document.querySelector('#regen-info');
const attackBtn = document.querySelector('#attack-btn');
const gameOverEl = document.querySelector('#gameover');
const finalScoreEl = document.querySelector('#final-score');
const captainNameEl = document.querySelector('#captain-name');
const logoutBtn = document.querySelector('#logout-btn');

const authOverlay = document.querySelector('#auth-overlay');
const tabLogin = document.querySelector('#tab-login');
const tabRegister = document.querySelector('#tab-register');
const authForm = document.querySelector('#auth-form');
const authUsernameInput = document.querySelector('#auth-username');
const authPasswordInput = document.querySelector('#auth-password');
const authMsgEl = document.querySelector('#auth-msg');
const authSubmitBtn = document.querySelector('#auth-submit');
const fillTestBtn = document.querySelector('#fill-test-btn');

let W, H, dpr;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth;
  H = innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// Kullanıcı & Oturum Yönetimi
const USERS_STORAGE_KEY = 'pirate2d_users_v1';
const SESSION_STORAGE_KEY = 'pirate2d_session_v1';
let authMode = 'login';
let currentUser = null;

function loadUsers() {
  let users = [];
  try {
    users = JSON.parse(localStorage.getItem(USERS_STORAGE_KEY) || '[]');
    if (!Array.isArray(users)) users = [];
  } catch {
    users = [];
  }

  const hasTest = users.some(u => u.username.toLowerCase() === 'test');
  if (!hasTest) {
    users.push({
      id: 'user_test_default',
      username: 'Test',
      password: 'test',
      createdAt: Date.now()
    });
    localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(users));
  }
  return users;
}

function saveUsers(users) {
  localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(users));
}

function setAuthMode(mode) {
  authMode = mode;
  authMsgEl.textContent = '';
  authMsgEl.className = 'auth-msg';
  if (mode === 'login') {
    tabLogin.classList.add('active');
    tabRegister.classList.remove('active');
    authSubmitBtn.textContent = 'Giriş Yap ve Yelken Aç';
    authPasswordInput.setAttribute('autocomplete', 'current-password');
  } else {
    tabRegister.classList.add('active');
    tabLogin.classList.remove('active');
    authSubmitBtn.textContent = 'Kayıt Ol ve Gemi Al';
    authPasswordInput.setAttribute('autocomplete', 'new-password');
  }
}

tabLogin.addEventListener('click', () => setAuthMode('login'));
tabRegister.addEventListener('click', () => setAuthMode('register'));

fillTestBtn.addEventListener('click', () => {
  setAuthMode('login');
  authUsernameInput.value = 'Test';
  authPasswordInput.value = 'test';
  authMsgEl.textContent = 'Test hesabı bilgileri dolduruldu.';
  authMsgEl.className = 'auth-msg ok';
});

function completeLogin(user) {
  currentUser = { id: user.id, username: user.username };
  localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(currentUser));
  captainNameEl.textContent = currentUser.username;
  authOverlay.style.display = 'none';
  initGame();
}

authForm.addEventListener('submit', e => {
  e.preventDefault();
  const username = authUsernameInput.value.trim();
  const password = authPasswordInput.value;

  if (!username || !password) {
    authMsgEl.textContent = 'Lütfen kullanıcı ismi ve şifre girin.';
    authMsgEl.className = 'auth-msg';
    return;
  }

  const users = loadUsers();

  if (authMode === 'register') {
    if (username.length < 2 || username.length > 20) {
      authMsgEl.textContent = 'Kullanıcı ismi 2-20 karakter arasında olmalı.';
      authMsgEl.className = 'auth-msg';
      return;
    }
    const exists = users.some(u => u.username.toLowerCase() === username.toLowerCase());
    if (exists) {
      authMsgEl.textContent = 'Bu gemi kullanıcı ismi zaten kayıtlı.';
      authMsgEl.className = 'auth-msg';
      return;
    }
    const newUser = {
      id: 'user_' + Date.now(),
      username,
      password,
      createdAt: Date.now()
    };
    users.push(newUser);
    saveUsers(users);
    authMsgEl.textContent = 'Kayıt başarılı! Gemine geçiliyor...';
    authMsgEl.className = 'auth-msg ok';
    setTimeout(() => completeLogin(newUser), 250);
    return;
  }

  const found = users.find(
    u => u.username.toLowerCase() === username.toLowerCase() && u.password === password
  );
  if (!found) {
    authMsgEl.textContent = 'Gemi kullanıcı ismi veya şifre hatalı.';
    authMsgEl.className = 'auth-msg';
    return;
  }

  authMsgEl.textContent = 'Giriş başarılı!';
  authMsgEl.className = 'auth-msg ok';
  setTimeout(() => completeLogin(found), 180);
});

logoutBtn.addEventListener('click', () => {
  localStorage.removeItem(SESSION_STORAGE_KEY);
  currentUser = null;
  isAttacking = false;
  targetPos = null;
  authOverlay.style.display = 'flex';
  authUsernameInput.value = 'Test';
  authPasswordInput.value = 'test';
  setAuthMode('login');
});

const WORLD_SIZE = 2400;
const CAMERA_ZOOM = 0.72;
const ATTACK_RANGE = 230;
const ENEMY_ATTACK_RANGE = ATTACK_RANGE / 2;
const PLAYER_MAX_SPEED = 1.85;
const ENEMY_MAX_SPEED = PLAYER_MAX_SPEED * (2 / 3);
const ENEMY_DAMAGE = 10;
const ENEMY_FIRE_INTERVAL = 3000;

let player, enemies, islands, treasures, shots, particles, shockwaves, flashes, floatingTexts, isGameOver;
let targetPos = null;
let selectedEnemyId = null;
let isAttacking = false;
let lastPlayerShot = 0;
let lastClickEnemyId = null;
let lastClickTime = 0;
let nextEnemyId = 1;

function getCameraOrigin() {
  return {
    x: player.x - (W / CAMERA_ZOOM) / 2,
    y: player.y - (H / CAMERA_ZOOM) / 2
  };
}

function screenToWorld(clientX, clientY) {
  const cam = getCameraOrigin();
  return {
    x: cam.x + clientX / CAMERA_ZOOM,
    y: cam.y + clientY / CAMERA_ZOOM
  };
}

function syncAttackButton() {
  const selectedEnemy = enemies.find(e => e.id === selectedEnemyId);
  if (!selectedEnemy || isGameOver) {
    selectedEnemyId = selectedEnemy ? selectedEnemy.id : null;
    isAttacking = false;
    attackBtn.disabled = true;
    attackBtn.textContent = 'SALDIR';
    attackBtn.className = '';
    return;
  }

  attackBtn.disabled = false;
  if (isAttacking) {
    attackBtn.textContent = 'ATIŞ KES';
    attackBtn.className = 'firing';
  } else {
    attackBtn.textContent = 'SALDIR';
    attackBtn.className = 'active';
  }
}

function initGame() {
  isGameOver = false;
  targetPos = null;
  selectedEnemyId = null;
  isAttacking = false;
  lastClickEnemyId = null;
  lastClickTime = 0;
  gameOverEl.style.display = 'none';

  const now = Date.now();
  const captain = currentUser ? currentUser.username : 'Test';
  player = {
    id: currentUser ? currentUser.id : 'player',
    x: 0, y: 0, a: 0, speed: 0, maxSpeed: PLAYER_MAX_SPEED,
    hp: 1000, maxHp: 1000,
    exp: 0, maxExp: 100, level: 1,
    damage: 180,
    score: 0, name: captain,
    wake: [],
    lastHitTime: now,
    lastRegenTick: now
  };

  shots = [];
  particles = [];
  shockwaves = [];
  flashes = [];
  floatingTexts = [];
  islands = [];
  treasures = [];
  enemies = [];

  for (let i = 0; i < 18; i++) {
    let ix, iy;
    do {
      ix = (Math.random() - 0.5) * WORLD_SIZE * 1.8;
      iy = (Math.random() - 0.5) * WORLD_SIZE * 1.8;
    } while (Math.hypot(ix, iy) < 230);
    islands.push({
      x: ix, y: iy,
      r: 45 + Math.random() * 55,
      seed: Math.random() * 10
    });
  }

  for (let i = 0; i < 15; i++) spawnTreasure();
  for (let i = 0; i < 7; i++) spawnEnemy();

  updateHUD();
  syncAttackButton();
}

function spawnTreasure() {
  treasures.push({
    x: (Math.random() - 0.5) * WORLD_SIZE * 1.7,
    y: (Math.random() - 0.5) * WORLD_SIZE * 1.7,
    bob: Math.random() * Math.PI * 2
  });
}

function spawnEnemy() {
  let ex, ey;
  do {
    ex = (Math.random() - 0.5) * 1200;
    ey = (Math.random() - 0.5) * 1200;
  } while (Math.hypot(ex - player.x, ey - player.y) < 160);

  enemies.push({
    id: nextEnemyId++,
    x: ex, y: ey,
    a: Math.random() * Math.PI * 2,
    hp: 700, maxHp: 700,
    lastShot: 0,
    turnTimer: 0,
    targetAngle: Math.random() * Math.PI * 2,
    name: 'Kızıl Sancak',
    wake: []
  });
}

function addExp(amount) {
  player.exp += amount;
  while (player.exp >= player.maxExp) {
    player.exp -= player.maxExp;
    player.level += 1;
    player.maxExp = Math.round(player.maxExp * 1.35);
    player.maxHp += 150;
    player.hp = player.maxHp;
    player.damage += 35;
    addFloatingText(player.x, player.y - 46, `SEVİYE ${player.level}!`, '#38bdf8');
  }
  updateHUD();
}

function updateHUD() {
  scoreEl.textContent = player.score;
  levelEl.textContent = player.level;
  hpTextEl.textContent = `${Math.ceil(player.hp)} / ${player.maxHp}`;
  expTextEl.textContent = `${player.exp} / ${player.maxExp}`;

  const hpPct = Math.max(0, Math.min(100, (player.hp / player.maxHp) * 100));
  hpBarEl.style.width = hpPct + '%';
  hpBarEl.style.background = hpPct > 50 ? '#4ade80' : hpPct > 25 ? '#facc15' : '#ef4444';

  const expPct = Math.max(0, Math.min(100, (player.exp / player.maxExp) * 100));
  expBarEl.style.width = expPct + '%';
}

function addFloatingText(x, y, text, color) {
  floatingTexts.push({
    x,
    y,
    text,
    color,
    alpha: 1,
    createdAt: Date.now(),
    duration: 850
  });
}

function spawnMuzzleEffects(x, y, angle) {
  flashes.push({
    x,
    y,
    angle,
    life: 1,
    decay: 0.16,
    radius: 16
  });

  for (let i = 0; i < 9; i++) {
    const spread = (Math.random() - 0.5) * 0.9;
    const dir = angle + spread;
    const spd = 0.6 + Math.random() * 2.1;
    particles.push({
      type: 'smoke',
      x,
      y,
      vx: Math.cos(dir) * spd,
      vy: Math.sin(dir) * spd,
      life: 0.78 + Math.random() * 0.2,
      decay: 0.015 + Math.random() * 0.012,
      size: 5 + Math.random() * 5,
      grow: 0.28,
      color: Math.random() < 0.5 ? '#e2e8f0' : '#cbd5e1'
    });
  }

  for (let i = 0; i < 6; i++) {
    const spread = (Math.random() - 0.5) * 0.65;
    const dir = angle + spread;
    const spd = 2.5 + Math.random() * 3.5;
    particles.push({
      type: 'spark',
      x,
      y,
      vx: Math.cos(dir) * spd,
      vy: Math.sin(dir) * spd,
      life: 1,
      decay: 0.06 + Math.random() * 0.03,
      size: 2 + Math.random() * 2,
      color: '#fde047'
    });
  }
}

function spawnImpactEffects(x, y, isPlayerHit = false) {
  shockwaves.push({
    x,
    y,
    r: 6,
    maxR: 38,
    alpha: 0.85,
    color: isPlayerHit ? '#fca5a5' : '#fdba74'
  });

  for (let i = 0; i < 18; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 1.2 + Math.random() * 4.2;
    const palette = ['#fffbeb', '#fde047', '#fb923c', '#ef4444'];
    particles.push({
      type: 'fire',
      x,
      y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 1,
      decay: 0.028 + Math.random() * 0.022,
      size: 3 + Math.random() * 4.5,
      grow: -0.02,
      color: palette[Math.floor(Math.random() * palette.length)]
    });
  }

  for (let i = 0; i < 8; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 0.5 + Math.random() * 1.6;
    particles.push({
      type: 'smoke',
      x,
      y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 0.7,
      decay: 0.016 + Math.random() * 0.01,
      size: 6 + Math.random() * 5,
      grow: 0.22,
      color: '#334155'
    });
  }
}

function fireLockedCannon(shooter, target, isPlayer) {
  const angleToTarget = Math.atan2(target.y - shooter.y, target.x - shooter.x);
  const muzzleX = shooter.x + Math.cos(angleToTarget) * 20;
  const muzzleY = shooter.y + Math.sin(angleToTarget) * 20;

  spawnMuzzleEffects(muzzleX, muzzleY, angleToTarget);

  shots.push({
    x: muzzleX,
    y: muzzleY,
    prevX: muzzleX,
    prevY: muzzleY,
    speed: isPlayer ? 10.5 : 8.2,
    isPlayer,
    targetId: target.id,
    damage: isPlayer ? player.damage : ENEMY_DAMAGE,
    trailTimer: 0
  });
}

canvas.addEventListener('pointerdown', e => {
  if (!currentUser || isGameOver) return;
  e.preventDefault();

  const world = screenToWorld(e.clientX, e.clientY);
  const worldX = world.x;
  const worldY = world.y;

  let clickedEnemy = null;
  let bestDist = 50;
  for (const enemy of enemies) {
    const d = Math.hypot(worldX - enemy.x, worldY - enemy.y);
    if (d <= bestDist) {
      bestDist = d;
      clickedEnemy = enemy;
    }
  }

  if (clickedEnemy) {
    const now = Date.now();
    if (lastClickEnemyId === clickedEnemy.id && now - lastClickTime < 650) {
      selectedEnemyId = clickedEnemy.id;
      const dist = Math.hypot(clickedEnemy.x - player.x, clickedEnemy.y - player.y);
      isAttacking = dist <= ATTACK_RANGE;
      lastClickEnemyId = null;
      lastClickTime = 0;
    } else {
      selectedEnemyId = clickedEnemy.id;
      lastClickEnemyId = clickedEnemy.id;
      lastClickTime = now;
    }
    syncAttackButton();
    return;
  }

  lastClickEnemyId = null;
  targetPos = {
    x: Math.max(-WORLD_SIZE, Math.min(WORLD_SIZE, worldX)),
    y: Math.max(-WORLD_SIZE, Math.min(WORLD_SIZE, worldY))
  };
});

attackBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  e.stopPropagation();
  if (!currentUser || isGameOver || attackBtn.disabled) return;

  const selectedEnemy = enemies.find(en => en.id === selectedEnemyId);
  if (!selectedEnemy) return;

  if (!isAttacking) {
    const dist = Math.hypot(selectedEnemy.x - player.x, selectedEnemy.y - player.y);
    if (dist > ATTACK_RANGE) return;
    isAttacking = true;
  } else {
    isAttacking = false;
  }
  syncAttackButton();
});

document.querySelector('#restart-btn').addEventListener('click', e => {
  e.stopPropagation();
  initGame();
});

function lerpAngle(a, b, t) {
  let diff = b - a;
  while (diff < -Math.PI) diff += Math.PI * 2;
  while (diff > Math.PI) diff -= Math.PI * 2;
  return a + diff * t;
}

function updateWake(ship, isMoving) {
  if (isMoving && Math.random() < 0.55) {
    ship.wake.push({
      x: ship.x - Math.cos(ship.a) * 24,
      y: ship.y - Math.sin(ship.a) * 24,
      r: 4.5,
      alpha: 0.5
    });
  }
  for (let i = ship.wake.length - 1; i >= 0; i--) {
    const w = ship.wake[i];
    w.r += 0.28;
    w.alpha -= 0.012;
    if (w.alpha <= 0) ship.wake.splice(i, 1);
  }
}

function update() {
  if (!currentUser || !player || isGameOver) return;

  const now = Date.now();

  if (player.hp < player.maxHp) {
    const sinceHit = now - player.lastHitTime;
    if (sinceHit >= 5000) {
      if (now - player.lastRegenTick >= 5000) {
        player.lastRegenTick = now;
        const healAmount = Math.min(100, player.maxHp - player.hp);
        player.hp += healAmount;
        addFloatingText(player.x, player.y - 42, `+${healAmount}`, '#4ade80');
        updateHUD();
      }
      const nextTickSec = Math.max(1, Math.ceil((5000 - (now - player.lastRegenTick)) / 1000));
      regenInfoEl.textContent = `Tamir aktif: +100 can (${nextTickSec}s)`;
    } else {
      const waitSec = Math.ceil((5000 - sinceHit) / 1000);
      regenInfoEl.textContent = `Tamir için saldırısız bekle: ${waitSec}s`;
    }
  } else {
    regenInfoEl.textContent = '';
  }

  const selectedEnemy = enemies.find(en => en.id === selectedEnemyId);
  if (!selectedEnemy && (selectedEnemyId !== null || isAttacking)) {
    selectedEnemyId = null;
    isAttacking = false;
    syncAttackButton();
  }

  if (targetPos) {
    const distToTarget = Math.hypot(targetPos.x - player.x, targetPos.y - player.y);
    if (distToTarget > 10) {
      const targetA = Math.atan2(targetPos.y - player.y, targetPos.x - player.x);
      player.a = lerpAngle(player.a, targetA, 0.14);
      player.speed = Math.min(player.maxSpeed, player.speed + 0.12);
    } else {
      targetPos = null;
      player.speed *= 0.9;
    }
  } else {
    player.speed *= 0.92;
  }

  player.x += Math.cos(player.a) * player.speed;
  player.y += Math.sin(player.a) * player.speed;
  player.x = Math.max(-WORLD_SIZE, Math.min(WORLD_SIZE, player.x));
  player.y = Math.max(-WORLD_SIZE, Math.min(WORLD_SIZE, player.y));
  updateWake(player, player.speed > 0.25);

  for (const isl of islands) {
    const dist = Math.hypot(player.x - isl.x, player.y - isl.y);
    const minDist = isl.r + 22;
    if (dist < minDist) {
      const ang = Math.atan2(player.y - isl.y, player.x - isl.x);
      player.x = isl.x + Math.cos(ang) * minDist;
      player.y = isl.y + Math.sin(ang) * minDist;
      player.speed *= 0.5;
      targetPos = null;
    }
  }

  if (isAttacking && selectedEnemy) {
    const distToEnemy = Math.hypot(selectedEnemy.x - player.x, selectedEnemy.y - player.y);
    if (distToEnemy > ATTACK_RANGE) {
      isAttacking = false;
      syncAttackButton();
    } else if (now - lastPlayerShot > 520) {
      lastPlayerShot = now;
      fireLockedCannon(player, selectedEnemy, true);
    }
  }

  for (let i = treasures.length - 1; i >= 0; i--) {
    const tr = treasures[i];
    if (Math.hypot(player.x - tr.x, player.y - tr.y) < 36) {
      treasures.splice(i, 1);
      player.score += 25;
      addExp(20);
      spawnImpactEffects(tr.x, tr.y, false);
      updateHUD();
      spawnTreasure();
    }
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
    let eSpeed = ENEMY_MAX_SPEED * 0.75;

    if (distToPlayer < 480) {
      const angToPlayer = Math.atan2(player.y - e.y, player.x - e.x);
      e.a = lerpAngle(e.a, angToPlayer, 0.05);
      if (distToPlayer > 175) {
        eSpeed = ENEMY_MAX_SPEED;
        e.x += Math.cos(e.a) * eSpeed;
        e.y += Math.sin(e.a) * eSpeed;
      }
      if (distToPlayer <= ENEMY_ATTACK_RANGE && now - e.lastShot > ENEMY_FIRE_INTERVAL) {
        e.lastShot = now;
        fireLockedCannon(e, player, false);
      }
    } else {
      e.turnTimer--;
      if (e.turnTimer <= 0) {
        e.targetAngle = Math.random() * Math.PI * 2;
        e.turnTimer = 120 + Math.random() * 150;
      }
      e.a = lerpAngle(e.a, e.targetAngle, 0.03);
      e.x += Math.cos(e.a) * eSpeed;
      e.y += Math.sin(e.a) * eSpeed;
    }

    updateWake(e, true);

    for (const isl of islands) {
      const dist = Math.hypot(e.x - isl.x, e.y - isl.y);
      if (dist < isl.r + 22) {
        const ang = Math.atan2(e.y - isl.y, e.x - isl.x);
        e.x = isl.x + Math.cos(ang) * (isl.r + 22);
        e.y = isl.y + Math.sin(ang) * (isl.r + 22);
        e.targetAngle = ang;
      }
    }
  }

  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i];
    s.prevX = s.x;
    s.prevY = s.y;

    s.trailTimer++;
    if (s.trailTimer % 2 === 0) {
      particles.push({
        type: 'smoke',
        x: s.x,
        y: s.y,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        life: 0.45,
        decay: 0.025,
        size: 3,
        grow: 0.12,
        color: '#cbd5e1'
      });
    }

    if (s.isPlayer) {
      const targetEnemy = enemies.find(en => en.id === s.targetId);
      if (!targetEnemy) {
        shots.splice(i, 1);
        continue;
      }
      const dx = targetEnemy.x - s.x;
      const dy = targetEnemy.y - s.y;
      const dist = Math.hypot(dx, dy);

      if (dist <= s.speed + 16) {
        targetEnemy.hp -= s.damage;
        addFloatingText(targetEnemy.x, targetEnemy.y - 38, `-${s.damage}`, '#ffd783');
        spawnImpactEffects(targetEnemy.x, targetEnemy.y, false);

        if (targetEnemy.hp <= 0) {
          spawnImpactEffects(targetEnemy.x, targetEnemy.y, false);
          if (selectedEnemyId === targetEnemy.id) {
            selectedEnemyId = null;
            isAttacking = false;
            syncAttackButton();
          }
          enemies = enemies.filter(en => en.id !== targetEnemy.id);
          player.score += 100;
          addExp(45);
          updateHUD();
          setTimeout(spawnEnemy, 2600);
        }
        shots.splice(i, 1);
        continue;
      }

      s.x += (dx / dist) * s.speed;
      s.y += (dy / dist) * s.speed;
    } else {
      const dx = player.x - s.x;
      const dy = player.y - s.y;
      const dist = Math.hypot(dx, dy);

      if (dist <= s.speed + 16) {
        player.hp = Math.max(0, player.hp - s.damage);
        player.lastHitTime = now;
        player.lastRegenTick = now;
        addFloatingText(player.x, player.y - 38, `-${s.damage}`, '#f87171');
        spawnImpactEffects(player.x, player.y, true);
        updateHUD();

        if (player.hp <= 0) {
          isGameOver = true;
          isAttacking = false;
          syncAttackButton();
          finalScoreEl.textContent = 'Toplanan Altın: ' + player.score;
          gameOverEl.style.display = 'flex';
        }
        shots.splice(i, 1);
        continue;
      }

      s.x += (dx / dist) * s.speed;
      s.y += (dy / dist) * s.speed;
    }
  }

  for (let i = flashes.length - 1; i >= 0; i--) {
    const fl = flashes[i];
    fl.life -= fl.decay;
    fl.radius += 1.4;
    if (fl.life <= 0) flashes.splice(i, 1);
  }

  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.r += (sw.maxR - sw.r) * 0.18 + 1.2;
    sw.alpha -= 0.045;
    if (sw.alpha <= 0) shockwaves.splice(i, 1);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vx *= 0.95;
    pt.vy *= 0.95;
    pt.size = Math.max(0.5, pt.size + (pt.grow || 0));
    pt.life -= pt.decay;
    if (pt.life <= 0) particles.splice(i, 1);
  }

  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    const elapsed = now - ft.createdAt;
    if (elapsed >= ft.duration) {
      floatingTexts.splice(i, 1);
      continue;
    }
    ft.y -= 0.75;
    ft.alpha = 1 - elapsed / ft.duration;
  }
}

function drawRangeRing(wx, wy) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(wx, wy, ATTACK_RANGE, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
  ctx.setLineDash([10, 8]);
  ctx.stroke();
  ctx.restore();
}

// 3D Perspektifli / Hacimli Kalyon Çizimi
function draw3DShip(p, isEnemy = false, isSelected = false) {
  // Su izi köpükleri
  for (const w of p.wake || []) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, w.alpha);
    ctx.fillStyle = '#e0f2fe';
    ctx.beginPath();
    ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Seçili düşman hedef halkası
  if (isEnemy && isSelected) {
    const pulse = 38 + Math.sin(Date.now() / 150) * 3.5;
    ctx.save();
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 3;
    ctx.setLineDash([9, 5]);
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + 4, pulse, pulse * 0.72, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(239, 68, 68, 0.14)';
    ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(p.x, p.y);

  // Düşman can çubuğu (3D üstte)
  if (isEnemy && p.hp < p.maxHp) {
    ctx.fillStyle = 'rgba(0,0,0,0.68)';
    ctx.fillRect(-24, -48, 48, 6);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(-24, -48, 48 * (p.hp / p.maxHp), 6);
  }

  // 3D İzometrik Gölge (su yüzeyinde kaydırılmış)
  ctx.save();
  ctx.translate(7, 13);
  ctx.rotate(p.a || 0);
  ctx.scale(1, 0.85);
  ctx.fillStyle = 'rgba(2, 22, 38, 0.42)';
  ctx.beginPath();
  ctx.moveTo(34, 0);
  ctx.quadraticCurveTo(16, 19, -26, 15);
  ctx.lineTo(-32, 0);
  ctx.lineTo(-26, -15);
  ctx.quadraticCurveTo(16, -19, 34, 0);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.rotate(p.a || 0);

  // 1. KATMAN: 3D Gövde Alt Yan Duvarı (Depth / Extrusion)
  ctx.fillStyle = isEnemy ? '#190706' : '#2b1406';
  ctx.beginPath();
  ctx.moveTo(33, 5);
  ctx.quadraticCurveTo(15, 22, -25, 18);
  ctx.lineTo(-31, 6);
  ctx.lineTo(-25, 11);
  ctx.quadraticCurveTo(15, 14, 33, 0);
  ctx.closePath();
  ctx.fill();

  // 2. KATMAN: Ana 3D Gövde (Işık/Gölge Gradyanı)
  const hullGrad = ctx.createLinearGradient(0, -18, 0, 18);
  if (isEnemy) {
    hullGrad.addColorStop(0, '#7f1d1d');
    hullGrad.addColorStop(0.45, '#450a0a');
    hullGrad.addColorStop(1, '#1c0505');
  } else {
    hullGrad.addColorStop(0, '#b46932');
    hullGrad.addColorStop(0.45, '#6e3b16');
    hullGrad.addColorStop(1, '#3b1d08');
  }

  ctx.fillStyle = hullGrad;
  ctx.beginPath();
  ctx.moveTo(34, 0);
  ctx.quadraticCurveTo(16, 18, -25, 14);
  ctx.lineTo(-31, 0);
  ctx.lineTo(-25, -14);
  ctx.quadraticCurveTo(16, -18, 34, 0);
  ctx.closePath();
  ctx.fill();

  // Altın / Metalik Borda Şeridi
  ctx.strokeStyle = isEnemy ? '#f87171' : '#f6d388';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 3. KATMAN: Yükseltilmiş Ahşap Güverte (3D İç Platform)
  const deckGrad = ctx.createLinearGradient(-20, -10, 24, 10);
  if (isEnemy) {
    deckGrad.addColorStop(0, '#5c1f1a');
    deckGrad.addColorStop(1, '#8c352b');
  } else {
    deckGrad.addColorStop(0, '#8f5629');
    deckGrad.addColorStop(1, '#c98549');
  }
  ctx.fillStyle = deckGrad;
  ctx.beginPath();
  ctx.moveTo(27, 0);
  ctx.quadraticCurveTo(11, 12, -21, 9);
  ctx.lineTo(-25, 0);
  ctx.lineTo(-21, -9);
  ctx.quadraticCurveTo(11, -12, 27, 0);
  ctx.closePath();
  ctx.fill();

  // Güverte tahta çizgileri
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.22)';
  ctx.lineWidth = 1;
  for (const dx of [-14, -6, 2, 10, 18]) {
    ctx.beginPath();
    ctx.moveTo(dx, -7);
    ctx.lineTo(dx, 7);
    ctx.stroke();
  }

  // Pruva ve Kıç Kasarası (3D Yükselti)
  ctx.fillStyle = isEnemy ? '#3b0d0b' : '#572d10';
  ctx.fillRect(-24, -8, 9, 16);
  ctx.fillRect(17, -6, 8, 12);

  // 4. KATMAN: 3D Top Namluları (Bordadan Dışa Uzanan)
  for (const cx of [-11, -2, 7, 15]) {
    // Üst borda topu
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(cx, -14.5, 5, 4);
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(cx + 3.5, -14.5, 1.5, 4);

    // Alt borda topu
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(cx, 10.5, 5, 4);
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(cx + 3.5, 10.5, 1.5, 4);
  }

  // 5. KATMAN: 3D Direkler, Arma ve Şişkin Yelkenler
  const masts = [-12, 1, 14];
  const sailSizes = [
    { w: 12, h: 15, curve: 6 },
    { w: 15, h: 19, curve: 8 },
    { w: 10, h: 13, curve: 5 }
  ];

  // Omurga / Direk hattı
  ctx.strokeStyle = '#2d1608';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-16, 0);
  ctx.lineTo(24, 0);
  ctx.stroke();

  masts.forEach((mx, idx) => {
    const s = sailSizes[idx];

    // Yelken gölgesi (güverteye düşen)
    ctx.fillStyle = 'rgba(0, 0, 0, 0.24)';
    ctx.beginPath();
    ctx.ellipse(mx + 4, 3, s.curve * 0.7, s.h * 0.75, 0.2, 0, Math.PI * 2);
    ctx.fill();

    // Direk gövdesi
    ctx.fillStyle = isEnemy ? '#3f1d18' : '#5c3314';
    ctx.beginPath();
    ctx.arc(mx, 0, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Şişkin 3D Yelken (Rüzgârla kavisli)
    const sailGrad = ctx.createLinearGradient(mx - s.curve, -s.h, mx + s.curve, s.h);
    if (isEnemy) {
      sailGrad.addColorStop(0, '#ef4444');
      sailGrad.addColorStop(0.5, '#b91c1c');
      sailGrad.addColorStop(1, '#450a0a');
    } else {
      sailGrad.addColorStop(0, '#fffbeb');
      sailGrad.addColorStop(0.55, '#f5ebd6');
      sailGrad.addColorStop(1, '#cbb382');
    }

    ctx.fillStyle = sailGrad;
    ctx.strokeStyle = isEnemy ? '#7f1d1d' : '#b89b67';
    ctx.lineWidth = 1.1;

    ctx.beginPath();
    ctx.moveTo(mx - 2, -s.h);
    ctx.quadraticCurveTo(mx + s.curve + 4, 0, mx - 2, s.h);
    ctx.quadraticCurveTo(mx + s.curve * 0.25, 0, mx - 2, -s.h);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  });

  // Baş Cıvadrası ve Ön Flok Yelkeni
  ctx.strokeStyle = isEnemy ? '#7f1d1d' : '#6e3b16';
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(28, 0);
  ctx.lineTo(42, 0);
  ctx.stroke();

  ctx.fillStyle = isEnemy ? '#dc2626' : '#fef3c7';
  ctx.beginPath();
  ctx.moveTo(22, 0);
  ctx.quadraticCurveTo(33, 6, 41, 0);
  ctx.quadraticCurveTo(33, -6, 22, 0);
  ctx.closePath();
  ctx.fill();

  // Kıç Sancak Bayrağı (Dalgalanan)
  const flagWave = Math.sin(Date.now() / 160 + (p.x || 0) * 0.05) * 3;
  ctx.fillStyle = isEnemy ? '#ef4444' : '#fbbf24';
  ctx.beginPath();
  ctx.moveTo(-29, 0);
  ctx.lineTo(-41, -5 + flagWave);
  ctx.lineTo(-38, 0 + flagWave * 0.5);
  ctx.lineTo(-41, 5 + flagWave);
  ctx.closePath();
  ctx.fill();

  ctx.restore();

  // Kaptan / Gemi İsmi
  ctx.fillStyle = isEnemy ? (isSelected ? '#fecaca' : '#fca5a5') : '#ffffff';
  ctx.textAlign = 'center';
  ctx.font = '700 12px system-ui';
  ctx.fillText(p.name, p.x, p.y - 34);
}

function drawMinimap() {
  mctx.clearRect(0, 0, 92, 92);
  if (!player) return;
  const scale = 42 / WORLD_SIZE;
  const cx = 46, cy = 46;

  mctx.fillStyle = '#d97706';
  for (const isl of islands) {
    mctx.beginPath();
    mctx.arc(cx + isl.x * scale, cy + isl.y * scale, Math.max(2, isl.r * scale), 0, Math.PI * 2);
    mctx.fill();
  }

  mctx.fillStyle = '#facc15';
  for (const tr of treasures) {
    mctx.fillRect(cx + tr.x * scale - 1.5, cy + tr.y * scale - 1.5, 3, 3);
  }

  for (const e of enemies) {
    mctx.fillStyle = e.id === selectedEnemyId ? '#ffffff' : '#ef4444';
    mctx.beginPath();
    mctx.arc(cx + e.x * scale, cy + e.y * scale, e.id === selectedEnemyId ? 3.5 : 2.5, 0, Math.PI * 2);
    mctx.fill();
  }

  mctx.fillStyle = '#4ade80';
  mctx.beginPath();
  mctx.arc(cx + player.x * scale, cy + player.y * scale, 3.2, 0, Math.PI * 2);
  mctx.fill();
}

function draw() {
  update();

  ctx.save();
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#087da0';
  ctx.fillRect(0, 0, W, H);

  if (!player) {
    ctx.restore();
    requestAnimationFrame(draw);
    return;
  }

  const cam = getCameraOrigin();
  const viewW = W / CAMERA_ZOOM;
  const viewH = H / CAMERA_ZOOM;

  ctx.scale(CAMERA_ZOOM, CAMERA_ZOOM);
  ctx.translate(-cam.x, -cam.y);

  const t = Date.now() / 800;
  ctx.strokeStyle = '#54bdd0';
  ctx.globalAlpha = 0.25;
  const startY = Math.floor(cam.y / 35) * 35;
  for (let y = startY - 35; y < cam.y + viewH + 70; y += 35) {
    ctx.beginPath();
    for (let x = Math.floor(cam.x / 16) * 16; x < cam.x + viewW + 32; x += 16) {
      const yy = y + Math.sin(x / 45 + t + y * 0.02) * 3;
      x === Math.floor(cam.x / 16) * 16 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  ctx.strokeStyle = 'rgba(255, 215, 131, 0.35)';
  ctx.lineWidth = 4;
  ctx.strokeRect(-WORLD_SIZE, -WORLD_SIZE, WORLD_SIZE * 2, WORLD_SIZE * 2);

  drawRangeRing(player.x, player.y);

  if (targetPos) {
    const pulse = 10 + Math.sin(Date.now() / 140) * 3;
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 215, 131, 0.85)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(targetPos.x, targetPos.y, pulse, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  for (const isl of islands) {
    if (isl.x + isl.r < cam.x - 150 || isl.x - isl.r > cam.x + viewW + 150 ||
        isl.y + isl.r < cam.y - 150 || isl.y - isl.r > cam.y + viewH + 150) continue;
    ctx.fillStyle = '#e9c46a';
    ctx.beginPath(); ctx.arc(isl.x, isl.y, isl.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2a9d8f';
    ctx.beginPath(); ctx.arc(isl.x, isl.y, isl.r * 0.72, 0, Math.PI * 2); ctx.fill();
  }

  for (const tr of treasures) {
    if (tr.x < cam.x - 80 || tr.x > cam.x + viewW + 80 ||
        tr.y < cam.y - 80 || tr.y > cam.y + viewH + 80) continue;
    const bob = Math.sin(Date.now() / 300 + tr.bob) * 2;
    ctx.fillStyle = '#92400e';
    ctx.fillRect(tr.x - 9, tr.y - 7 + bob, 18, 14);
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 2;
    ctx.strokeRect(tr.x - 9, tr.y - 7 + bob, 18, 14);
  }

  for (const s of shots) {
    ctx.save();
    ctx.strokeStyle = s.isPlayer ? 'rgba(253, 224, 71, 0.45)' : 'rgba(248, 113, 113, 0.45)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(s.prevX, s.prevY);
    ctx.lineTo(s.x, s.y);
    ctx.stroke();

    ctx.fillStyle = s.isPlayer ? '#0f172a' : '#7f1d1d';
    ctx.beginPath();
    ctx.arc(s.x, s.y, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = s.isPlayer ? '#fde047' : '#fca5a5';
    ctx.beginPath();
    ctx.arc(s.x, s.y, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  for (const e of enemies) {
    if (e.x < cam.x - 120 || e.x > cam.x + viewW + 120 ||
        e.y < cam.y - 120 || e.y > cam.y + viewH + 120) continue;
    draw3DShip(e, true, e.id === selectedEnemyId);
  }

  draw3DShip(player, false, false);

  for (const sw of shockwaves) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, sw.alpha);
    ctx.strokeStyle = sw.color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  for (const pt of particles) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, pt.life);
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  for (const fl of flashes) {
    const fx = fl.x;
    const fy = fl.y;
    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(fl.angle);
    ctx.globalAlpha = Math.max(0, fl.life);
    const grad = ctx.createRadialGradient(0, 0, 1, 0, 0, fl.radius);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.45, '#fde047');
    grad.addColorStop(1, 'rgba(249, 115, 22, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, fl.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  for (const ft of floatingTexts) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, ft.alpha);
    ctx.font = '800 14px system-ui';
    ctx.textAlign = 'center';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.75)';
    ctx.strokeText(ft.text, ft.x, ft.y);
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
  }

  ctx.restore();

  drawMinimap();
  requestAnimationFrame(draw);
}

loadUsers();
try {
  const savedSession = JSON.parse(localStorage.getItem(SESSION_STORAGE_KEY) || 'null');
  if (savedSession && savedSession.username) {
    completeLogin(savedSession);
  } else {
    authUsernameInput.value = 'Test';
    authPasswordInput.value = 'test';
  }
} catch {
  authUsernameInput.value = 'Test';
  authPasswordInput.value = 'test';
}

draw();
</script>
