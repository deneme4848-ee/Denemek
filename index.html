<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Korsan Dünyası 2D</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #073b59; color: #fff; font-family: system-ui, -apple-system, sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; cursor: crosshair; }

    #hud {
      position: fixed; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .panel {
      background: rgba(0, 30, 48, 0.8); backdrop-filter: blur(4px);
      padding: 8px 14px; border-radius: 12px; font-size: 13px;
      border: 1px solid rgba(255,255,255,0.16);
    }
    #hp-bar-bg {
      width: 130px; height: 8px; background: rgba(255,255,255,0.2);
      border-radius: 4px; margin-top: 6px; overflow: hidden;
    }
    #hp-bar {
      width: 100%; height: 100%; background: #4ade80; transition: width 0.2s, background 0.2s;
    }
    #minimap {
      width: 92px; height: 92px; border-radius: 50%;
      background: rgba(0, 24, 38, 0.88); border: 2px solid rgba(233, 211, 161, 0.55);
    }
    #hint {
      position: fixed; top: 76px; left: 12px; font-size: 12px;
      background: rgba(0, 30, 48, 0.7); padding: 6px 10px; border-radius: 8px;
      pointer-events: none; max-width: 72vw;
    }

    #combat-bar {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      z-index: 6; display: flex; gap: 10px; align-items: center;
    }
    #attack-btn {
      min-width: 170px; height: 52px; padding: 0 24px;
      border-radius: 999px; border: 2px solid rgba(255,255,255,0.25);
      background: rgba(15, 35, 50, 0.75); color: rgba(255,255,255,0.4);
      font-size: 15px; font-weight: 800; letter-spacing: 0.6px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45);
      cursor: not-allowed; transition: all 0.16s ease;
      touch-action: manipulation;
    }
    #attack-btn.active {
      border-color: #ffd783;
      background: linear-gradient(180deg, #c24929, #8f2d14);
      color: #fff;
      cursor: pointer;
    }
    #attack-btn.active:active { transform: scale(0.96); }
    #attack-btn.firing {
      border-color: #fda4af;
      background: linear-gradient(180deg, #dc2626, #7f1d1d);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(239, 68, 68, 0.6);
    }

    #gameover {
      display: none; position: fixed; inset: 0; background: rgba(0, 18, 28, 0.86);
      flex-direction: column; align-items: center; justify-content: center; z-index: 12;
      text-align: center; padding: 20px;
    }
    #gameover h1 { color: #ffd783; margin: 0 0 10px; font-size: 32px; }
    #gameover p { font-size: 16px; margin: 0 0 24px; color: #cbd5e1; }
    #restart-btn {
      padding: 12px 28px; font-size: 16px; font-weight: bold; border-radius: 12px;
      border: 2px solid #ffd783; background: #a33d22; color: white; cursor: pointer;
    }
  </style>
</head>
<body>

  <canvas id="game"></canvas>

  <div id="hud">
    <div class="panel">
      <div><strong>Kaptan</strong> · Altın: <span id="score">0</span></div>
      <div id="hp-bar-bg"><div id="hp-bar"></div></div>
    </div>
    <canvas id="minimap" width="92" height="92"></canvas>
  </div>

  <div id="hint">Denize tek tıkla: Yelken aç · Düşmana 1 tık: Seç · 2 tık: Saldır</div>

  <div id="combat-bar">
    <button id="attack-btn" disabled>SALDIR</button>
  </div>

  <div id="gameover">
    <h1>GEMİN BATTI!</h1>
    <p id="final-score">Toplanan Altın: 0</p>
    <button id="restart-btn">YENİDEN YELKEN AÇ</button>
  </div>

<script>
const canvas = document.querySelector('#game');
const ctx = canvas.getContext('2d');
const miniCanvas = document.querySelector('#minimap');
const mctx = miniCanvas.getContext('2d');

const scoreEl = document.querySelector('#score');
const hpBarEl = document.querySelector('#hp-bar');
const attackBtn = document.querySelector('#attack-btn');
const gameOverEl = document.querySelector('#gameover');
const finalScoreEl = document.querySelector('#final-score');

let W, H, dpr;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth;
  H = innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const WORLD_SIZE = 2400;

let player, enemies, islands, treasures, shots, particles, isGameOver;
let targetPos = null;
let selectedEnemyId = null;
let isAttacking = false;
let lastPlayerShot = 0;
let lastClickEnemyId = null;
let lastClickTime = 0;
let nextEnemyId = 1;

function syncAttackButton() {
  const selectedEnemy = enemies.find(e => e.id === selectedEnemyId);
  if (!selectedEnemy || isGameOver) {
    selectedEnemyId = selectedEnemy ? selectedEnemy.id : null;
    isAttacking = false;
    attackBtn.disabled = true;
    attackBtn.textContent = 'SALDIR';
    attackBtn.className = '';
    return;
  }

  attackBtn.disabled = false;
  if (isAttacking) {
    attackBtn.textContent = 'ATIŞ KES';
    attackBtn.className = 'firing';
  } else {
    attackBtn.textContent = 'SALDIR';
    attackBtn.className = 'active';
  }
}

function initGame() {
  isGameOver = false;
  targetPos = null;
  selectedEnemyId = null;
  isAttacking = false;
  lastClickEnemyId = null;
  lastClickTime = 0;
  gameOverEl.style.display = 'none';

  player = {
    id: 'player',
    x: 0, y: 0, a: 0, speed: 0, maxSpeed: 3.7,
    hp: 100, maxHp: 100, score: 0, name: 'Kara İnci',
    wake: []
  };

  shots = [];
  particles = [];
  islands = [];
  treasures = [];
  enemies = [];

  for (let i = 0; i < 18; i++) {
    let ix, iy;
    do {
      ix = (Math.random() - 0.5) * WORLD_SIZE * 1.8;
      iy = (Math.random() - 0.5) * WORLD_SIZE * 1.8;
    } while (Math.hypot(ix, iy) < 230);
    islands.push({
      x: ix, y: iy,
      r: 45 + Math.random() * 55,
      seed: Math.random() * 10
    });
  }

  for (let i = 0; i < 15; i++) spawnTreasure();
  for (let i = 0; i < 7; i++) spawnEnemy();

  updateHUD();
  syncAttackButton();
}

function spawnTreasure() {
  treasures.push({
    x: (Math.random() - 0.5) * WORLD_SIZE * 1.7,
    y: (Math.random() - 0.5) * WORLD_SIZE * 1.7,
    bob: Math.random() * Math.PI * 2
  });
}

function spawnEnemy() {
  let ex, ey;
  do {
    ex = (Math.random() - 0.5) * WORLD_SIZE * 1.7;
    ey = (Math.random() - 0.5) * WORLD_SIZE * 1.7;
  } while (Math.hypot(ex - player.x, ey - player.y) < 420);

  enemies.push({
    id: nextEnemyId++,
    x: ex, y: ey,
    a: Math.random() * Math.PI * 2,
    hp: 70, maxHp: 70,
    lastShot: 0,
    turnTimer: 0,
    targetAngle: Math.random() * Math.PI * 2,
    name: 'Kızıl Sancak',
    wake: []
  });
}

function updateHUD() {
  scoreEl.textContent = player.score;
  const pct = Math.max(0, (player.hp / player.maxHp) * 100);
  hpBarEl.style.width = pct + '%';
  hpBarEl.style.background = pct > 50 ? '#4ade80' : pct > 25 ? '#facc15' : '#ef4444';
}

function createExplosion(x, y, color = '#ff9e2c', count = 14) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 1 + Math.random() * 3.5;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 1,
      decay: 0.025 + Math.random() * 0.02,
      size: 3 + Math.random() * 4,
      color
    });
  }
}

// Doğrudan hedef gemiye kilitlenen gülle oluşturur (ıskalama yok)
function fireLockedCannon(shooter, targetId, isPlayer) {
  const muzzleX = shooter.x + Math.cos(shooter.a) * 18;
  const muzzleY = shooter.y + Math.sin(shooter.a) * 18;

  shots.push({
    x: muzzleX,
    y: muzzleY,
    speed: isPlayer ? 9.5 : 7.8,
    isPlayer,
    targetId,
    damage: isPlayer ? 18 : 11
  });

  createExplosion(muzzleX, muzzleY, '#e2e8f0', 5);
}

canvas.addEventListener('pointerdown', e => {
  if (isGameOver) return;

  const camX = player.x - W / 2;
  const camY = player.y - H / 2;
  const worldX = e.clientX + camX;
  const worldY = e.clientY + camY;

  let clickedEnemy = null;
  let bestDist = 36;
  for (const enemy of enemies) {
    const d = Math.hypot(worldX - enemy.x, worldY - enemy.y);
    if (d <= bestDist) {
      bestDist = d;
      clickedEnemy = enemy;
    }
  }

  if (clickedEnemy) {
    const now = Date.now();
    if (lastClickEnemyId === clickedEnemy.id && now - lastClickTime < 650) {
      selectedEnemyId = clickedEnemy.id;
      isAttacking = true;
      lastClickEnemyId = null;
      lastClickTime = 0;
    } else {
      selectedEnemyId = clickedEnemy.id;
      lastClickEnemyId = clickedEnemy.id;
      lastClickTime = now;
    }
    syncAttackButton();
    return;
  }

  selectedEnemyId = null;
  isAttacking = false;
  lastClickEnemyId = null;
  syncAttackButton();

  targetPos = {
    x: Math.max(-WORLD_SIZE, Math.min(WORLD_SIZE, worldX)),
    y: Math.max(-WORLD_SIZE, Math.min(WORLD_SIZE, worldY))
  };
});

attackBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  e.stopPropagation();
  if (isGameOver || attackBtn.disabled) return;

  const selectedEnemy = enemies.find(en => en.id === selectedEnemyId);
  if (!selectedEnemy) return;

  isAttacking = !isAttacking;
  syncAttackButton();
});

document.querySelector('#restart-btn').addEventListener('click', e => {
  e.stopPropagation();
  initGame();
});

function lerpAngle(a, b, t) {
  let diff = b - a;
  while (diff < -Math.PI) diff += Math.PI * 2;
  while (diff > Math.PI) diff -= Math.PI * 2;
  return a + diff * t;
}

function updateWake(ship, isMoving) {
  if (isMoving && Math.random() < 0.45) {
    ship.wake.push({
      x: ship.x - Math.cos(ship.a) * 20,
      y: ship.y - Math.sin(ship.a) * 20,
      r: 4,
      alpha: 0.45
    });
  }
  for (let i = ship.wake.length - 1; i >= 0; i--) {
    const w = ship.wake[i];
    w.r += 0.25;
    w.alpha -= 0.012;
    if (w.alpha <= 0) ship.wake.splice(i, 1);
  }
}

function update() {
  if (isGameOver) return;

  const selectedEnemy = enemies.find(en => en.id === selectedEnemyId);
  if (!selectedEnemy && (selectedEnemyId !== null || isAttacking)) {
    selectedEnemyId = null;
    isAttacking = false;
    syncAttackButton();
  }

  if (targetPos) {
    const distToTarget = Math.hypot(targetPos.x - player.x, targetPos.y - player.y);
    if (distToTarget > 14) {
      const targetA = Math.atan2(targetPos.y - player.y, targetPos.x - player.x);
      player.a = lerpAngle(player.a, targetA, 0.13);
      player.speed = Math.min(player.maxSpeed, player.speed + 0.16);
    } else {
      targetPos = null;
      player.speed *= 0.9;
    }
  } else {
    player.speed *= 0.92;
  }

  player.x += Math.cos(player.a) * player.speed;
  player.y += Math.sin(player.a) * player.speed;
  player.x = Math.max(-WORLD_SIZE, Math.min(WORLD_SIZE, player.x));
  player.y = Math.max(-WORLD_SIZE, Math.min(WORLD_SIZE, player.y));
  updateWake(player, player.speed > 0.4);

  for (const isl of islands) {
    const dist = Math.hypot(player.x - isl.x, player.y - isl.y);
    const minDist = isl.r + 18;
    if (dist < minDist) {
      const ang = Math.atan2(player.y - isl.y, player.x - isl.x);
      player.x = isl.x + Math.cos(ang) * minDist;
      player.y = isl.y + Math.sin(ang) * minDist;
      player.speed *= 0.5;
      targetPos = null;
    }
  }

  // Seçili düşmana doğrudan kilitli ateş
  const now = Date.now();
  if (isAttacking && selectedEnemy) {
    const desiredAngle = Math.atan2(selectedEnemy.y - player.y, selectedEnemy.x - player.x);
    if (!targetPos) {
      player.a = lerpAngle(player.a, desiredAngle, 0.12);
    }
    if (now - lastPlayerShot > 520) {
      lastPlayerShot = now;
      fireLockedCannon(player, selectedEnemy.id, true);
    }
  }

  // Hazine toplama
  for (let i = treasures.length - 1; i >= 0; i--) {
    const tr = treasures[i];
    if (Math.hypot(player.x - tr.x, player.y - tr.y) < 34) {
      treasures.splice(i, 1);
      player.score += 25;
      player.hp = Math.min(player.maxHp, player.hp + 15);
      createExplosion(tr.x, tr.y, '#ffd783', 10);
      updateHUD();
      spawnTreasure();
    }
  }

  // Düşman Yapay Zekası
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
    let eSpeed = 1.4;

    if (distToPlayer < 480) {
      const angToPlayer = Math.atan2(player.y - e.y, player.x - e.x);
      e.a = lerpAngle(e.a, angToPlayer, 0.05);
      if (distToPlayer > 175) {
        eSpeed = 2.0;
        e.x += Math.cos(e.a) * eSpeed;
        e.y += Math.sin(e.a) * eSpeed;
      }
      if (distToPlayer < 420 && now - e.lastShot > 1800) {
        e.lastShot = now;
        fireLockedCannon(e, player.id, false);
      }
    } else {
      e.turnTimer--;
      if (e.turnTimer <= 0) {
        e.targetAngle = Math.random() * Math.PI * 2;
        e.turnTimer = 120 + Math.random() * 150;
      }
      e.a = lerpAngle(e.a, e.targetAngle, 0.03);
      e.x += Math.cos(e.a) * eSpeed;
      e.y += Math.sin(e.a) * eSpeed;
    }

    updateWake(e, true);

    for (const isl of islands) {
      const dist = Math.hypot(e.x - isl.x, e.y - isl.y);
      if (dist < isl.r + 18) {
        const ang = Math.atan2(e.y - isl.y, e.x - isl.x);
        e.x = isl.x + Math.cos(ang) * (isl.r + 18);
        e.y = isl.y + Math.sin(ang) * (isl.r + 18);
        e.targetAngle = ang;
      }
    }
  }

  // Kilitli Top Gülleleri (Manevra ile ıskalamaz, doğrudan hedefe ulaşıp hasar verir)
  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i];

    if (s.isPlayer) {
      const targetEnemy = enemies.find(en => en.id === s.targetId);
      if (!targetEnemy) {
        shots.splice(i, 1);
        continue;
      }
      const dx = targetEnemy.x - s.x;
      const dy = targetEnemy.y - s.y;
      const dist = Math.hypot(dx, dy);

      if (dist <= s.speed + 12) {
        targetEnemy.hp -= s.damage;
        createExplosion(targetEnemy.x, targetEnemy.y, '#ff7b00', 10);
        if (targetEnemy.hp <= 0) {
          createExplosion(targetEnemy.x, targetEnemy.y, '#ef4444', 24);
          if (selectedEnemyId === targetEnemy.id) {
            selectedEnemyId = null;
            isAttacking = false;
            syncAttackButton();
          }
          enemies = enemies.filter(en => en.id !== targetEnemy.id);
          player.score += 100;
          updateHUD();
          setTimeout(spawnEnemy, 2600);
        }
        shots.splice(i, 1);
        continue;
      }

      s.x += (dx / dist) * s.speed;
      s.y += (dy / dist) * s.speed;
    } else {
      const dx = player.x - s.x;
      const dy = player.y - s.y;
      const dist = Math.hypot(dx, dy);

      if (dist <= s.speed + 12) {
        player.hp -= s.damage;
        createExplosion(player.x, player.y, '#ef4444', 12);
        updateHUD();
        if (player.hp <= 0) {
          isGameOver = true;
          isAttacking = false;
          syncAttackButton();
          finalScoreEl.textContent = 'Toplanan Altın: ' + player.score;
          gameOverEl.style.display = 'flex';
        }
        shots.splice(i, 1);
        continue;
      }

      s.x += (dx / dist) * s.speed;
      s.y += (dy / dist) * s.speed;
    }
  }

  // Parçacıklar
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.life -= pt.decay;
    if (pt.life <= 0) particles.splice(i, 1);
  }
}

function drawRealisticShip(p, sx, sy, camX, camY, isEnemy = false, isSelected = false) {
  for (const w of p.wake || []) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, w.alpha);
    ctx.fillStyle = '#e0f2fe';
    ctx.beginPath();
    ctx.arc(w.x - camX, w.y - camY, w.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  if (isEnemy && isSelected) {
    const pulse = 30 + Math.sin(Date.now() / 150) * 3;
    ctx.save();
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 5]);
    ctx.beginPath();
    ctx.arc(sx, sy, pulse, 0, Math.PI * 2);
    ctx.stroke();

    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(239, 68, 68, 0.14)';
    ctx.beginPath();
    ctx.arc(sx, sy, pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(sx, sy);

  if (isEnemy && p.hp < p.maxHp) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(-20, -36, 40, 5);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(-20, -36, 40 * (p.hp / p.maxHp), 5);
  }

  ctx.rotate(p.a || 0);

  ctx.fillStyle = 'rgba(0, 20, 35, 0.35)';
  ctx.beginPath();
  ctx.moveTo(27, 4);
  ctx.quadraticCurveTo(10, 18, -22, 13);
  ctx.lineTo(-27, 4);
  ctx.lineTo(-22, -6);
  ctx.quadraticCurveTo(10, -10, 27, 4);
  ctx.closePath();
  ctx.fill();

  const hullGrad = ctx.createLinearGradient(0, -14, 0, 14);
  if (isEnemy) {
    hullGrad.addColorStop(0, '#4a1c16');
    hullGrad.addColorStop(0.5, '#2b100d');
    hullGrad.addColorStop(1, '#180807');
  } else {
    hullGrad.addColorStop(0, '#8c5327');
    hullGrad.addColorStop(0.5, '#5c3314');
    hullGrad.addColorStop(1, '#381d09');
  }

  ctx.fillStyle = hullGrad;
  ctx.beginPath();
  ctx.moveTo(28, 0);
  ctx.quadraticCurveTo(12, 15, -21, 11);
  ctx.lineTo(-26, 0);
  ctx.lineTo(-21, -11);
  ctx.quadraticCurveTo(12, -15, 28, 0);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = isEnemy ? '#fca5a5' : '#f3d59b';
  ctx.lineWidth = 1.8;
  ctx.stroke();

  ctx.fillStyle = isEnemy ? '#6b2920' : '#a86b38';
  ctx.beginPath();
  ctx.moveTo(21, 0);
  ctx.quadraticCurveTo(8, 10, -17, 7);
  ctx.lineTo(-20, 0);
  ctx.lineTo(-17, -7);
  ctx.quadraticCurveTo(8, -10, 21, 0);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#0f172a';
  for (const lx of [-8, 1, 10]) {
    ctx.fillRect(lx, -10.5, 4, 2.2);
    ctx.fillRect(lx, 8.3, 4, 2.2);
  }

  ctx.strokeStyle = '#3b2314';
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  ctx.moveTo(-10, 0);
  ctx.lineTo(8, 0);
  ctx.stroke();

  ctx.fillStyle = isEnemy ? '#dc2626' : '#f8ecd2';
  ctx.strokeStyle = isEnemy ? '#7f1d1d' : '#cbb382';
  ctx.lineWidth = 1;

  ctx.beginPath();
  ctx.moveTo(-4, -11);
  ctx.quadraticCurveTo(6, 0, -4, 11);
  ctx.quadraticCurveTo(-1, 0, -4, -11);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(8, -8);
  ctx.quadraticCurveTo(19, 0, 8, 8);
  ctx.quadraticCurveTo(11, 0, 8, -8);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = isEnemy ? '#ef4444' : '#fbbf24';
  ctx.beginPath();
  ctx.moveTo(-22, 0);
  ctx.lineTo(-31, -4);
  ctx.lineTo(-29, 0);
  ctx.lineTo(-31, 4);
  ctx.closePath();
  ctx.fill();

  ctx.restore();

  ctx.fillStyle = isEnemy ? (isSelected ? '#fecaca' : '#fca5a5') : '#ffffff';
  ctx.textAlign = 'center';
  ctx.font = '600 12px system-ui';
  ctx.fillText(p.name, sx, sy - 25);
}

function drawMinimap() {
  mctx.clearRect(0, 0, 92, 92);
  const scale = 42 / WORLD_SIZE;
  const cx = 46, cy = 46;

  mctx.fillStyle = '#d97706';
  for (const isl of islands) {
    mctx.beginPath();
    mctx.arc(cx + isl.x * scale, cy + isl.y * scale, Math.max(2, isl.r * scale), 0, Math.PI * 2);
    mctx.fill();
  }

  mctx.fillStyle = '#facc15';
  for (const tr of treasures) {
    mctx.fillRect(cx + tr.x * scale - 1.5, cy + tr.y * scale - 1.5, 3, 3);
  }

  for (const e of enemies) {
    mctx.fillStyle = e.id === selectedEnemyId ? '#ffffff' : '#ef4444';
    mctx.beginPath();
    mctx.arc(cx + e.x * scale, cy + e.y * scale, e.id === selectedEnemyId ? 3.5 : 2.5, 0, Math.PI * 2);
    mctx.fill();
  }

  mctx.fillStyle = '#4ade80';
  mctx.beginPath();
  mctx.arc(cx + player.x * scale, cy + player.y * scale, 3.2, 0, Math.PI * 2);
  mctx.fill();
}

function draw() {
  update();

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#087da0';
  ctx.fillRect(0, 0, W, H);

  const camX = player.x - W / 2;
  const camY = player.y - H / 2;

  const t = Date.now() / 800;
  ctx.strokeStyle = '#54bdd0';
  ctx.globalAlpha = 0.25;
  const offsetY = -(camY % 35);
  for (let y = offsetY - 35; y < H + 35; y += 35) {
    ctx.beginPath();
    for (let x = 0; x < W; x += 12) {
      const worldX = x + camX;
      const worldY = y + camY;
      const yy = y + Math.sin(worldX / 45 + t + worldY * 0.02) * 3;
      x === 0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  ctx.strokeStyle = 'rgba(255, 215, 131, 0.35)';
  ctx.lineWidth = 4;
  ctx.strokeRect(-WORLD_SIZE - camX, -WORLD_SIZE - camY, WORLD_SIZE * 2, WORLD_SIZE * 2);

  if (targetPos) {
    const tx = targetPos.x - camX;
    const ty = targetPos.y - camY;
    const pulse = 10 + Math.sin(Date.now() / 140) * 3;
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 215, 131, 0.85)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(tx, ty, pulse, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  for (const isl of islands) {
    const sx = isl.x - camX, sy = isl.y - camY;
    if (sx < -150 || sx > W + 150 || sy < -150 || sy > H + 150) continue;
    ctx.fillStyle = '#e9c46a';
    ctx.beginPath(); ctx.arc(sx, sy, isl.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2a9d8f';
    ctx.beginPath(); ctx.arc(sx, sy, isl.r * 0.72, 0, Math.PI * 2); ctx.fill();
  }

  for (const tr of treasures) {
    const sx = tr.x - camX, sy = tr.y - camY;
    if (sx < -50 || sx > W + 50 || sy < -50 || sy > H + 50) continue;
    const bob = Math.sin(Date.now() / 300 + tr.bob) * 2;
    ctx.fillStyle = '#92400e';
    ctx.fillRect(sx - 9, sy - 7 + bob, 18, 14);
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx - 9, sy - 7 + bob, 18, 14);
  }

  for (const s of shots) {
    ctx.fillStyle = s.isPlayer ? '#1e293b' : '#991b1b';
    ctx.beginPath();
    ctx.arc(s.x - camX, s.y - camY, 4.5, 0, Math.PI * 2);
    ctx.fill();
  }

  for (const e of enemies) {
    const sx = e.x - camX, sy = e.y - camY;
    if (sx < -100 || sx > W + 100 || sy < -100 || sy > H + 100) continue;
    drawRealisticShip(e, sx, sy, camX, camY, true, e.id === selectedEnemyId);
  }

  drawRealisticShip(player, W / 2, H / 2, camX, camY, false, false);

  for (const pt of particles) {
    ctx.globalAlpha = pt.life;
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x - camX, pt.y - camY, pt.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawMinimap();
  requestAnimationFrame(draw);
}

initGame();
draw();
</script>
