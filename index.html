<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Korsan Dünyası 2D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#073b59;color:#fff;font-family:system-ui}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;text-shadow:0 2px 3px #000}#status{background:#001e30bb;padding:8px 12px;border-radius:10px;font-size:13px}#fire{position:fixed;right:22px;bottom:36px;width:86px;height:86px;border-radius:50%;border:2px solid #ffd783;background:#a33d22dd;color:white;font-weight:800;font-size:15px}#stick{position:fixed;left:22px;bottom:28px;width:130px;height:130px;border-radius:50%;background:#001e3066;border:2px solid #ffffff66;touch-action:none}#nub{position:absolute;left:37px;top:37px;width:52px;height:52px;border-radius:50%;background:#e6f4ffbb;border:2px solid white}#hint{position:fixed;top:55px;left:10px;font-size:12px;background:#001e3077;padding:5px 8px;border-radius:7px}
</style></head><body><canvas id="game"></canvas><div id="hud"><div id="status">Bağlanıyor…</div><div id="status">KORSAN DÜNYASI 2D</div></div><div id="hint">Joystick ile yelken aç · Ateş ile top at</div><div id="stick"><div id="nub"></div></div><button id="fire">TOP AT</button>
<script src="/socket.io/socket.io.js"></script><script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');
let W,H,dpr,players={},me=null,connected=false,shots=[];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();
const socket=io();socket.on('connect',()=>{connected=true;status.textContent='Sunucuya bağlandı · '+socket.id.slice(0,5)});socket.on('disconnect',()=>{connected=false;status.textContent='Bağlantı kesildi'});socket.on('state',s=>{players=s.players;me=socket.id});
function ship(p){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a||0);ctx.fillStyle='#54351f';ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(9,13);ctx.lineTo(-17,10);ctx.lineTo(-22,0);ctx.lineTo(-17,-10);ctx.lineTo(9,-13);ctx.closePath();ctx.fill();ctx.strokeStyle='#e9d3a1';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#f5e6c7';ctx.beginPath();ctx.moveTo(-7,-2);ctx.lineTo(8,0);ctx.lineTo(-7,7);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(-7,1);ctx.lineTo(8,0);ctx.lineTo(-7,-7);ctx.closePath();ctx.fill();ctx.restore();ctx.fillStyle='white';ctx.textAlign='center';ctx.font='12px system-ui';ctx.fillText(p.name||'Korsan',p.x,p.y-24)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#087da0';ctx.fillRect(0,0,W,H);let t=Date.now()/800;ctx.strokeStyle='#54bdd0';ctx.globalAlpha=.25;for(let y=15;y<H;y+=35){ctx.beginPath();for(let x=0;x<W;x+=8){let yy=y+Math.sin(x/45+t+y)*3;x?ctx.lineTo(x,yy):ctx.moveTo(x,yy)}ctx.stroke()}ctx.globalAlpha=1;
for(const [id,p] of Object.entries(players)){if(id===me){p.x=W/2;p.y=H/2} else {p.x=W/2+(p.x-(players[me]?.x||0));p.y=H/2+(p.y-(players[me]?.y||0))}ship(p)}
requestAnimationFrame(draw)}draw();
let dx=0,dy=0;const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');function setStick(e){let r=stick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),len=Math.hypot(x,y),max=42;if(len>max){x=x/len*max;y=y/len*max}dx=x/max;dy=y/max;nub.style.left=(39+x)+'px';nub.style.top=(39+y)+'px'}function reset(){dx=dy=0;nub.style.left='37px';nub.style.top='37px'}stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);setStick(e)});stick.addEventListener('pointermove',e=>{if(e.buttons)setStick(e)});stick.addEventListener('pointerup',reset);stick.addEventListener('pointercancel',reset);
setInterval(()=>{if(socket.connected)socket.emit('move',{dx,dy})},50);document.querySelector('#fire').addEventListener('pointerdown',e=>{e.preventDefault();socket.emit('fire')});
</script></body></html>
