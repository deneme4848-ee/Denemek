function formatShortNumber(num) {
  if (num >= 1000000000) return (num / 1000000000).toFixed(num % 1000000000 !== 0 ? 1 : 0) + 't';
  if (num >= 1000000)    return (num / 1000000).toFixed(num % 1000000 !== 0 ? 1 : 0) + 'm';

}

const USERS_STORAGE_KEY = 'pirate3d_users_v28';
const SESSION_STORAGE_KEY = 'pirate3d_session_v28';
let authMode = 'login';
let currentUser = null;

function loadUsers() {
  let users = [];
  try { users = JSON.parse(localStorage.getItem(USERS_STORAGE_KEY) || '[]'); } catch { users = []; }
  if (!users.some(u => u.username.toLowerCase() === 'test')) {
    users.push({ id: 'user_test', username: 'Test', password: 'test', ownedShips: ['standard'], equippedShip: 'standard' });
    localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(users));
  }
  return users;
}
function saveUsers(users) { localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(users)); }

function setAuthMode(mode) {
  authMode = mode;
  if (!authMsgEl) return;
  authMsgEl.textContent = '';
  if (mode === 'login') {
    tabLogin.classList.add('active'); tabRegister.classList.remove('active');
    authSubmitBtn.textContent = 'DENİZE AÇIL';
  } else {
    tabRegister.classList.add('active'); tabLogin.classList.remove('active');
    authSubmitBtn.textContent = 'KAYIT OL VE BAŞLA';
  }
}
if (tabLogin) tabLogin.addEventListener('click', () => setAuthMode('login'));
if (tabRegister) tabRegister.addEventListener('click', () => setAuthMode('register'));
if (fillTestBtn) fillTestBtn.addEventListener('click', () => { authUsernameInput.value = 'Test'; authPasswordInput.value = 'test'; });

function completeLogin(user) {
  currentUser = { 
    id: user.id, 
    username: user.username, 
    ownedShips: user.ownedShips || ['standard'], 
    equippedShip: user.equippedShip || 'standard'

  tagUsernameEl.textContent = currentUser.username;
  shipTitleEl.textContent = SHIP_MODELS[currentUser.equippedShip]?.name || '8 Yönlü Efsanevi Gemi';
  authOverlay.style.display = 'none';

}

if (authForm) {
  authForm.addEventListener('submit', e => {
    e.preventDefault();
    const uname = authUsernameInput.value.trim(); const pass = authPasswordInput.value;
    const users = loadUsers();
    if (authMode === 'register') {
      if (users.some(u => u.username.toLowerCase() === uname.toLowerCase())) { authMsgEl.textContent = 'Bu isim zaten kayıtlı.'; return; }
      const nu = { id: 'u_' + Date.now(), username: uname, password: pass, ownedShips: ['standard'], equippedShip: 'standard' };
      users.push(nu); saveUsers(users);
      setTimeout(() => completeLogin(nu), 200);
    } else {

      if (!found) { authMsgEl.textContent = 'Hatalı kullanıcı adı veya şifre.'; return; }
      completeLogin(found);
    }
  });
}

function createStaticOceanTextures() {
  const size = 1024;
  const colorCanvas = document.createElement('canvas');
  colorCanvas.width = size;
  colorCanvas.height = size;
  const ctx = colorCanvas.getContext('2d');

  const grad = ctx.createRadialGradient(size/2, size/2, 50, size/2, size/2, size/1.2);
  grad.addColorStop(0, '#0c4a6e');
  grad.addColorStop(0.5, '#07334d');
  grad.addColorStop(1, '#042033');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);

  for (let i = 0; i < 420; i++) {
    const cx = Math.random() * size;
    const cy = Math.random() * size;
    const rx = 25 + Math.random() * 65;
    const ry = 10 + Math.random() * 28;
    const rot = Math.random() * Math.PI;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.strokeStyle = i % 2 === 0 ? 'rgba(56, 189, 248, 0.09)' : 'rgba(14, 165, 233, 0.07)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }

  const bumpCanvas = document.createElement('canvas');
  bumpCanvas.width = size;
  bumpCanvas.height = size;
  const bCtx = bumpCanvas.getContext('2d');
  bCtx.fillStyle = '#808080';
  bCtx.fillRect(0, 0, size, size);

  for (let i = 0; i < 600; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const r = 15 + Math.random() * 45;
    const bGrad = bCtx.createRadialGradient(x, y, 1, x, y, r);
    bGrad.addColorStop(0, 'rgba(255,255,255,0.22)');
    bGrad.addColorStop(1, 'rgba(128,128,128,0)');
    bCtx.fillStyle = bGrad;
    bCtx.beginPath();
    bCtx.arc(x, y, r, 0, Math.PI * 2);
    bCtx.fill();
  }

  const mapTex = new THREE.CanvasTexture(colorCanvas);
  mapTex.wrapS = THREE.RepeatWrapping;
  mapTex.wrapT = THREE.RepeatWrapping;
  mapTex.repeat.set(16, 16);

  const bumpTex = new THREE.CanvasTexture(bumpCanvas);
  bumpTex.wrapS = THREE.RepeatWrapping;
  bumpTex.wrapT = THREE.RepeatWrapping;
  bumpTex.repeat.set(16, 16);

  return { mapTex, bumpTex };
}

function normalizeSpriteTexture(rawTexture, extraType = 'none') {
  const img = rawTexture.image;
  if (!img || !img.width) return { texture: rawTexture, aspect: 1 };

  const canvas = document.createElement('canvas');
  canvas.width = img.width;
  canvas.height = img.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);

  let minX = img.width, minY = img.height, maxX = 0, maxY = 0;
  let foundOpaque = false;

  try {
    const data = ctx.getImageData(0, 0, img.width, img.height).data;
    for (let y = 0; y < img.height; y++) {
      for (let x = 0; x < img.width; x++) {
        const alpha = data[(y * img.width + x) * 4 + 3];
        if (alpha > 20) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
          foundOpaque = true;
        }
      }
    }
  } catch (e) {
    return { texture: rawTexture, aspect: img.width / img.height };
  }

  if (!foundOpaque || maxX <= minX || maxY <= minY) {
    return { texture: rawTexture, aspect: img.width / img.height };
  }

  const trimW = maxX - minX + 1;
  const trimH = maxY - minY + 1;
  const trimCanvas = document.createElement('canvas');
  trimCanvas.width = trimW;
  trimCanvas.height = trimH;
  const tCtx = trimCanvas.getContext('2d');
  tCtx.drawImage(img, minX, minY, trimW, trimH, 0, 0, trimW, trimH);

  if (extraType && extraType !== 'none') {
    tCtx.save();
    const cx = trimW / 2;
    const cy = trimH / 2;

    if (extraType === 'skull') {
      tCtx.fillStyle = '#ffffff';
      tCtx.strokeStyle = '#ff0000';
      tCtx.lineWidth = 4;
      tCtx.beginPath(); tCtx.arc(cx, cy - 18, 18, 0, Math.PI * 2); tCtx.fill(); tCtx.stroke();
      tCtx.fillRect(cx - 10, cy - 8, 20, 18);
      tCtx.strokeRect(cx - 10, cy - 8, 20, 18);
      tCtx.strokeStyle = '#f8fafc'; tCtx.lineWidth = 6;
      tCtx.beginPath(); tCtx.moveTo(cx - 28, cy - 30); tCtx.lineTo(cx + 28, cy + 20); tCtx.stroke();
      tCtx.beginPath(); tCtx.moveTo(cx + 28, cy - 30); tCtx.lineTo(cx - 28, cy + 20); tCtx.stroke();
    } else if (extraType === 'kraken') {
      tCtx.strokeStyle = '#34d399'; tCtx.fillStyle = '#059669'; tCtx.lineWidth = 8;
      tCtx.beginPath(); tCtx.moveTo(cx - 22, cy - 10); tCtx.quadraticCurveTo(cx - 55, cy + 15, cx - 30, cy + 50); tCtx.stroke();
      tCtx.beginPath(); tCtx.moveTo(cx + 22, cy - 10); tCtx.quadraticCurveTo(cx + 55, cy + 15, cx + 30, cy + 50); tCtx.stroke();
    } else if (extraType === 'phoenix') {
      tCtx.fillStyle = 'rgba(255, 100, 0, 0.95)';
      tCtx.strokeStyle = '#ffff00'; tCtx.lineWidth = 3;
      tCtx.beginPath(); tCtx.ellipse(cx - 22, cy, 18, 38, -0.4, 0, Math.PI * 2); tCtx.fill(); tCtx.stroke();
      tCtx.beginPath(); tCtx.ellipse(cx + 22, cy, 18, 38, 0.4, 0, Math.PI * 2); tCtx.fill(); tCtx.stroke();
    } else if (extraType === 'shadow' || extraType === 'titan') {
      tCtx.fillStyle = extraType === 'titan' ? '#94a3b8' : '#4338ca';
      tCtx.strokeStyle = '#ffffff'; tCtx.lineWidth = 4;
      tCtx.fillRect(cx - 22, cy - 35, 44, 18);
      tCtx.strokeRect(cx - 22, cy - 35, 44, 18);
      tCtx.fillRect(cx - 26, cy - 10, 52, 20);
      tCtx.strokeRect(cx - 26, cy - 10, 52, 20);
    } else if (extraType === 'frost' || extraType === 'dragon') {
      tCtx.fillStyle = extraType === 'frost' ? '#38bdf8' : '#ef4444';
      tCtx.strokeStyle = '#ffffff'; tCtx.lineWidth = 4;
      tCtx.beginPath(); tCtx.moveTo(cx, cy - 55); tCtx.lineTo(cx - 18, cy - 22); tCtx.lineTo(cx + 18, cy - 22); tCtx.closePath(); tCtx.fill(); tCtx.stroke();
    } else if (extraType === 'blood' || extraType === 'royal') {
      tCtx.fillStyle = extraType === 'blood' ? '#dc2626' : '#fbbf24';
      tCtx.strokeStyle = '#ffffff'; tCtx.lineWidth = 4;
      tCtx.fillRect(cx - 16, cy - 40, 32, 32);
      tCtx.strokeRect(cx - 16, cy - 40, 32, 32);
    } else if (extraType === 'thunder') {
      tCtx.strokeStyle = '#fde047'; tCtx.lineWidth = 6;
      tCtx.beginPath(); tCtx.moveTo(cx, cy - 45); tCtx.lineTo(cx - 16, cy - 10); tCtx.lineTo(cx + 10, cy - 5); tCtx.lineTo(cx - 6, cy + 35); tCtx.stroke();
    } else if (extraType === 'void') {
      tCtx.strokeStyle = '#e879f9'; tCtx.lineWidth = 6;
      tCtx.beginPath(); tCtx.arc(cx, cy, 36, 0, Math.PI * 2); tCtx.stroke();
    }
    tCtx.restore();
  }

  const normalizedTex = new THREE.CanvasTexture(trimCanvas);
  normalizedTex.generateMipmaps = true;
  return { texture: normalizedTex, aspect: trimW / trimH };
}

function loadShipTextures(onAllLoaded) {
  const textureFiles = {
    right: 'gemi11.png',
    topRight: 'gemi12.png',
    top: 'gemi13.png',
    topLeft: 'gemi14.png',
    left: 'gemi15.png',
    bottomLeft: 'gemi16.png',
    bottom: 'gemi17.png',
    bottomRight: 'gemi18.png'
  };

  let loadedCount = 0;
  const total = Object.keys(textureFiles).length;

  for (const [key, src] of Object.entries(textureFiles)) {
    textureLoader.load(src, (tex) => {
      shipTextures[key] = normalizeSpriteTexture(tex, 'none');
      loadedCount++;
      if (loadedCount === total && onAllLoaded) onAllLoaded();
    }, undefined, () => {
      loadedCount++;
      if (loadedCount === total && onAllLoaded) onAllLoaded();
    });
  }
}

function getDirectionSpriteData(angle, shipId = 'standard') {
  let deg = (angle * (180 / Math.PI)) % 360;
  if (deg < 0) deg += 360;

  let rawKey = 'top';
  if (deg >= 337.5 || deg < 22.5) rawKey = 'right';
  else if (deg >= 22.5 && deg < 67.5) rawKey = 'bottomRight';
  else if (deg >= 67.5 && deg < 112.5) rawKey = 'bottom';
  else if (deg >= 112.5 && deg < 157.5) rawKey = 'bottomLeft';
  else if (deg >= 157.5 && deg < 202.5) rawKey = 'left';
  else if (deg >= 202.5 && deg < 247.5) rawKey = 'topLeft';
  else if (deg >= 247.5 && deg < 292.5) rawKey = 'top';
  else rawKey = 'topRight';

  const rawTex = shipTextures[rawKey] || shipTextures.top;
  if (!rawTex) return null;

  const modelSpec = SHIP_MODELS[shipId] || SHIP_MODELS.standard;
  if (modelSpec.extraCanvasType && modelSpec.extraCanvasType !== 'none') {
    const origImg = shipTextures[rawKey]?.texture?.image;
    if (origImg) {
      const dummyTex = new THREE.Texture(origImg);
      dummyTex.needsUpdate = true;
      return normalizeSpriteTexture(dummyTex, modelSpec.extraCanvasType);
    }
  }

  return rawTex;
}

function applySpriteByAngle(sprite, angle, baseHeight = BASE_SHIP_HEIGHT, shipId = 'standard') {
  const data = getDirectionSpriteData(angle, shipId);
  if (!data) return;
  sprite.material.map = data.texture;
  sprite.scale.set(baseHeight * data.aspect, baseHeight, 1);

  const modelSpec = SHIP_MODELS[shipId] || SHIP_MODELS.standard;
  if (modelSpec.tint) {
    sprite.material.color.setHex(modelSpec.tint);
  }
  if (modelSpec.emissive) {
    sprite.material.emissive = new THREE.Color(modelSpec.emissive);
    sprite.material.emissiveIntensity = 0.6;
  }
}

  playerNeonRing.rotation.x = -Math.PI / 2;
  playerNeonRing.position.y = 0.8;
  scene.add(playerNeonRing);

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  window.addEventListener('pointerdown', e => {
    if (
      e.target.closest('#top-vital-hud') ||
      e.target.closest('#top-right-hud') ||
      e.target.closest('#bottom-dock') ||

    ) return;

    if (e.target.closest('#minimap')) {
      const rect = miniCanvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;
      const w = miniCanvas.width, h = miniCanvas.height;
      const mapWorldX = ((clickX - w / 2) / (w / 2)) * (WORLD_SIZE / 2);
      const mapWorldZ = ((clickY - h / 2) / (h / 2)) * (WORLD_SIZE / 2);
      targetPos = { x: mapWorldX, z: mapWorldZ };
      return;
    }

    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    const enemySprites = enemies.map(en => en.sprite);
    const intersects = raycaster.intersectObjects(enemySprites);
    if (intersects.length > 0) {
      let obj = intersects[0].object;
      if (obj.userData.enemyId) {
        selectedEnemyId = obj.userData.enemyId;
        isAttacking = false;
        updateTargetCard();
        syncAttackButton();
        return;
      }
    }

    const oceanIntersect = raycaster.intersectObject(ocean);
    if (oceanIntersect.length > 0) {
      targetPos = { x: oceanIntersect[0].point.x, z: oceanIntersect[0].point.z };
    }
  });

  loadShipTextures(() => {
    startGameLogic();
    animate3D();
  });
}

let player, gameIslands = [];
let targetPos = null, selectedEnemyId = null, isAttacking = false, isGameOver = false;
let lastPlayerAttackTime = 0;
let nextNpcIdCounter = 1;

function startGameLogic() {
  isGameOver = false; targetPos = null; selectedEnemyId = null; isAttacking = false;
  gameOverEl.style.display = 'none';

  player = {
    x: 0, z: 0, a: -Math.PI / 2, speed: 0, maxSpeed: 1.85,
    hp: 1000000, maxHp: 1000000, score: 100000000,
    level: 1, exp: 0, maxExp: 100,
    selectedAmmo: 'iron',
    ammo: { iron: 1000000, chain: 1000000, fire: 1000000, dragon: 1000000 },
    lastDamagedTime: 0
  };

  if (playerSprite) scene.remove(playerSprite);
  const initialData = shipTextures.top || Object.values(shipTextures)[0];
  const mat = new THREE.SpriteMaterial({ map: initialData.texture, transparent: true, alphaTest: 0.1 });
  playerSprite = new THREE.Sprite(mat);
  playerSprite.center.set(0.5, 0.95);
  const currentShipId = currentUser?.equippedShip || 'standard';
  applySpriteByAngle(playerSprite, player.a, BASE_SHIP_HEIGHT, currentShipId);
  scene.add(playerSprite);

  gameIslands.forEach(isl => scene.remove(isl.mesh));
  gameIslands = [];
  const islGeo = new THREE.CylinderGeometry(40, 70, 35, 6);
  const islMat = new THREE.MeshStandardMaterial({ color: 0x0f382b, roughness: 0.9 });
  for (let i = 0; i < 8; i++) {
    const mesh = new THREE.Mesh(islGeo, islMat);
    mesh.position.set((Math.random() - 0.5) * 800, 10, (Math.random() - 0.5) * 800);
    scene.add(mesh);
    gameIslands.push({ mesh, r: 60 });
  }

  enemies.forEach(en => scene.remove(en.sprite));
  enemies = [];
  nextNpcIdCounter = 1;

  for (let i = 0; i < 6; i++) {
    spawnEnemySprite(nextNpcIdCounter++);
  }

  selectAmmoSlot('iron');
  updateTargetCard();
  updateHUD();
  syncAttackButton();
}

function spawnEnemySprite(id) {
  let ex, ez;
  do {
    ex = (Math.random() - 0.5) * 800;
    ez = (Math.random() - 0.5) * 800;
  } while (Math.hypot(ex, ez) < 300);

  const initialData = shipTextures.top || Object.values(shipTextures)[0];
  const mat = new THREE.SpriteMaterial({ map: initialData.texture, transparent: true, alphaTest: 0.1 });
  const sprite = new THREE.Sprite(mat);
  sprite.center.set(0.5, 0.95);
  applySpriteByAngle(sprite, 0, BASE_SHIP_HEIGHT, 'standard');
  sprite.position.set(ex, SHIP_Y_POS, ez);
  sprite.userData.enemyId = id;
  scene.add(sprite);

  enemies.push({
    id, name: `Korsan Gemisi #${id}`, sprite,
    hp: 520, maxHp: 520, baseSpeed: 1.15, slowTimer: 0,
    a: 0, wanderAngle: Math.random() * Math.PI * 2, wanderTimer: 0,
    lastAttackTime: 0
  });
}

function selectAmmoSlot(type) {
  if (!player || !AMMO_TYPES[type]) return;
  player.selectedAmmo = type;
  ammoSlots.forEach(slot => {
    slot.classList.toggle('selected', slot.dataset.type === type);
  });
  const info = AMMO_TYPES[type];
  activeAmmoInfoEl.textContent = `Seçili: ${info.name} (${info.desc})`;
  syncAttackButton();
}

ammoSlots.forEach(slot => {
  slot.addEventListener('click', () => selectAmmoSlot(slot.dataset.type));
});

window.addEventListener('keydown', e => {
  if (e.key === '1') selectAmmoSlot('iron');
  if (e.key === '2') selectAmmoSlot('chain');
  if (e.key === '3') selectAmmoSlot('fire');
  if (e.key === '4') selectAmmoSlot('dragon');

    marketPanel.classList.toggle('open');
    tabMarket.classList.add('active'); tabShipyard.classList.remove('active');
    sectionMarket.classList.add('active'); sectionShipyard.classList.remove('active');
  }
  if (e.key.toLowerCase() === 't') {
    marketPanel.classList.toggle('open');
    tabShipyard.classList.add('active'); tabMarket.classList.remove('active');
    sectionShipyard.classList.add('active'); sectionMarket.classList.remove('active');
    renderShipyardList();
  }
});

function updateTargetCard() {
  if (!selectedEnemyId) {
    targetCardEl.classList.remove('visible');
    return;
  }
  const target = enemies.find(e => e.id === selectedEnemyId);
  if (!target) {
    targetCardEl.classList.remove('visible');
    selectedEnemyId = null;
    return;
  }
  targetCardEl.classList.add('visible');
  targetNameEl.textContent = target.name;
  targetHpTextEl.textContent = `${Math.ceil(target.hp)}/${target.maxHp}`;
  targetHpBarEl.style.width = Math.max(0, (target.hp / target.maxHp) * 100) + '%';
}

function syncAttackButton() {
  if (isGameOver || !player) return;
  const currentAmmoQty = player.ammo[player.selectedAmmo] || 0;
  attackBtn.disabled = !selectedEnemyId || currentAmmoQty <= 0;
  attackBtn.classList.toggle('firing', isAttacking);
  attackBtnText.textContent = isAttacking ? 'DURDUR' : 'ATEŞ ET';
}

attackBtn.addEventListener('click', () => {
  if (!selectedEnemyId) return;
  const currentAmmoQty = player.ammo[player.selectedAmmo] || 0;
  if (currentAmmoQty <= 0) return;
  isAttacking = !isAttacking;
  syncAttackButton();
});

restartBtn.addEventListener('click', () => startGameLogic());

function showFloatingDamage(wx, wz, text, colorHex) {
  const div = document.createElement('div');
  div.className = 'floating-dmg';
  div.textContent = text;
  div.style.color = colorHex;
  document.body.appendChild(div);

  const tempV = new THREE.Vector3(wx, SHIP_Y_POS, wz);
  tempV.project(camera);
  const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
  const y = (tempV.y * -0.5 + 0.5) * window.innerHeight;
  div.style.left = x + 'px';
  div.style.top = y + 'px';

  setTimeout(() => div.remove(), 900);
}

function fireProjectile(startX, startZ, targetX, targetZ, ammoKey, onHit, isEnemy = false) {
  const ammoSpec = isEnemy ? { color: 0xff2200 } : AMMO_TYPES[ammoKey];
  const pGeo = new THREE.SphereGeometry(7.5, 16, 16);
  const pMat = new THREE.MeshStandardMaterial({ 
    color: isEnemy ? 0xff2200 : ammoSpec.color, 
    emissive: isEnemy ? 0xff0000 : ammoSpec.color,
    emissiveIntensity: 2.0,
    roughness: 0.1 
  });
  const mesh = new THREE.Mesh(pGeo, pMat);
  
  const GULLE_Y_OFFSET = 50;
  mesh.position.set(startX, SHIP_Y_POS - GULLE_Y_OFFSET, startZ);
  scene.add(mesh);

  activeProjectiles.push({
    mesh, x: startX, z: startZ, targetX, targetZ,
    speed: 6, 
    ammoKey, onHit, sparkTimer: 0,
    yOffset: GULLE_Y_OFFSET,
    isEnemy
  });
}

function animate3D() {
  requestAnimationFrame(animate3D);

  if (player && !isGameOver) {
    if (enemies.length < 6) {
      spawnEnemySprite(nextNpcIdCounter++);
    }
  }

  if (!player || isGameOver) {
    if (scene && camera && renderer) renderer.render(scene, camera);
    return;
  }

  const now = Date.now();
  if (player.hp < player.maxHp && (now - player.lastDamagedTime > 5000)) {
    const healAmount = 5000;
    player.hp = Math.min(player.maxHp, player.hp + healAmount);
    showFloatingDamage(player.x, player.z, '+' + healAmount.toLocaleString(), '#22c55e');
    updateHUD();
  }

  if (targetPos) {
    const dx = targetPos.x - player.x;
    const dz = targetPos.z - player.z;
    const dist = Math.hypot(dx, dz);
    if (dist > 8) {
      player.a = Math.atan2(dz, dx);
      player.speed = Math.min(player.maxSpeed, player.speed + 0.12);
    } else {
      targetPos = null;
      player.speed *= 0.9;
    }
  } else {
    player.speed *= 0.92;
  }

  player.x += Math.cos(player.a) * player.speed;
  player.z += Math.sin(player.a) * player.speed;

  coordDisplayEl.textContent = `X: ${Math.round((player.x / (WORLD_SIZE / 2)) * 50)} · Y: ${Math.round((player.z / (WORLD_SIZE / 2)) * 50)}`;

  if (playerSprite) {
    playerSprite.position.set(player.x, SHIP_Y_POS, player.z);
    const currentShipId = currentUser?.equippedShip || 'standard';
    applySpriteByAngle(playerSprite, player.a, BASE_SHIP_HEIGHT, currentShipId);
  }

  if (playerNeonRing) {
    playerNeonRing.position.set(player.x, 0.8, player.z);
    playerNeonRing.rotation.z += 0.02;
  }

  rangeRingMesh.position.set(player.x, 0.6, player.z);

  if (playerSprite) {
    const tempVector = new THREE.Vector3(player.x, SHIP_Y_POS, player.z);
    tempVector.project(camera);
    const xPx = (tempVector.x *  .5 + .5) * window.innerWidth;
    const yPx = (tempVector.y * -.5 + .5) * window.innerHeight + 55;
    playerLabelEl.style.transform = `translate(-50%, 0) translate(${xPx}px, ${yPx}px)`;
  }

  camera.position.x += (player.x - camera.position.x) * 0.08;
  camera.position.z += (player.z + 540 - camera.position.z) * 0.08;
  camera.lookAt(player.x, 0, player.z);

  for (let i = activeProjectiles.length - 1; i >= 0; i--) {
    const p = activeProjectiles[i];
    const dx = p.targetX - p.x;
    const dz = p.targetZ - p.z;
    const dist = Math.hypot(dx, dz);

    if (dist < p.speed) {
      scene.remove(p.mesh);
      p.mesh.geometry.dispose();
      p.mesh.material.dispose();
      activeProjectiles.splice(i, 1);
      if (p.onHit) p.onHit();
    } else {
      p.x += (dx / dist) * p.speed;
      p.z += (dz / dist) * p.speed;
      p.mesh.position.set(p.x, SHIP_Y_POS - p.yOffset, p.z);
      p.mesh.rotation.x += 0.2;
      p.mesh.rotation.y += 0.2;

      p.sparkTimer++;
      if (p.sparkTimer % 1 === 0) {
        let sparkColor = p.isEnemy ? 0xff3300 : 0xffa500;
        if (!p.isEnemy) {
          if (p.ammoKey === 'fire') {
            sparkColor = Math.random() > 0.4 ? 0xff2200 : 0xffaa00;
          } else if (p.ammoKey === 'dragon') {
            const colors = [0x3b82f6, 0x8b5cf6, 0x06b6d4, 0xec4899];
            sparkColor = colors[Math.floor(Math.random() * colors.length)];
          } else if (p.ammoKey === 'chain') {
            sparkColor = 0xcccccc;
          } else {
            sparkColor = 0x888888;
          }
        }

        const sparkGeo = new THREE.SphereGeometry(p.isEnemy ? 4.5 : 3.2, 8, 8);
        const sparkMat = new THREE.MeshBasicMaterial({ color: sparkColor, transparent: true, opacity: 0.98 });
        const sparkMesh = new THREE.Mesh(sparkGeo, sparkMat);
        sparkMesh.position.set(
          p.x + (Math.random() - 0.5) * 10, 
          SHIP_Y_POS - p.yOffset + (Math.random() - 0.5) * 10, 
          p.z + (Math.random() - 0.5) * 10
        );
        scene.add(sparkMesh);
        particleSystems.push({ mesh: sparkMesh, life: 28 });
      }
    }
  }

  for (let i = particleSystems.length - 1; i >= 0; i--) {
    const pt = particleSystems[i];
    pt.life--;
    pt.mesh.scale.multiplyScalar(0.88);
    if (pt.life <= 0) {
      scene.remove(pt.mesh);
      pt.mesh.geometry.dispose();
      pt.mesh.material.dispose();
      particleSystems.splice(i, 1);
    }
  }

  for (const en of enemies) {
    if (en.slowTimer > 0) en.slowTimer--;
    const activeSpeed = en.slowTimer > 0 ? en.baseSpeed * 0.5 : en.baseSpeed;
    const distToPlayer = Math.hypot(player.x - en.x, player.z - en.z);

    if (distToPlayer <= AGGRO_RANGE) {
      en.a = Math.atan2(player.z - en.z, player.x - en.x);
      
      if (distToPlayer > ATTACK_RANGE - 20) {
        en.x += Math.cos(en.a) * (activeSpeed * 1.25);
        en.z += Math.sin(en.a) * (activeSpeed * 1.25);
      }

      if (distToPlayer <= ATTACK_RANGE && (now - en.lastAttackTime >= 3000)) {
        en.lastAttackTime = now;

        fireProjectile(en.x, en.z, player.x, player.z, 'fire', () => {
          player.hp = Math.max(0, player.hp - 100);
          player.lastDamagedTime = now;
          showFloatingDamage(player.x, player.z, '-100', '#ef4444');
          updateHUD();
          if (player.hp <= 0) {
            isGameOver = true;
            isAttacking = false;
            gameOverEl.style.display = 'flex';
            finalScoreEl.textContent = 'Toplanan Altın: ' + formatShortNumber(player.score);
          }
        }, true);
      }
    } else {
      en.wanderTimer--;
      if (en.wanderTimer <= 0) {
        en.wanderAngle += (Math.random() - 0.5) * 1.5;
        en.wanderTimer = 180 + Math.random() * 200;
      }
      en.a = en.wanderAngle;
      en.x += Math.cos(en.a) * (activeSpeed * 0.75);
      en.z += Math.sin(en.a) * (activeSpeed * 0.75);
    }

    en.x = Math.max(-WORLD_SIZE/2, Math.min(WORLD_SIZE/2, en.x));
    en.z = Math.max(-WORLD_SIZE/2, Math.min(WORLD_SIZE/2, en.z));

    if (en.sprite) {
      en.sprite.position.set(en.x, SHIP_Y_POS, en.z);
      applySpriteByAngle(en.sprite, en.a, BASE_SHIP_HEIGHT, 'standard');
    }
  }

  if (isAttacking && selectedEnemyId) {
    const target = enemies.find(e => e.id === selectedEnemyId);
    const ammoKey = player.selectedAmmo;
    const ammoSpec = AMMO_TYPES[ammoKey];

    if (target && player.ammo[ammoKey] > 0) {
      const d = Math.hypot(target.x - player.x, target.z - player.z);
      if (d <= ATTACK_RANGE && (now - lastPlayerAttackTime >= 1000)) {
        lastPlayerAttackTime = now;

        fireProjectile(player.x, player.z, target.x, target.z, ammoKey, () => {
          target.hp -= ammoSpec.damage;
          if (ammoSpec.slow < 1.0) target.slowTimer = 240;

          showFloatingDamage(target.x, target.z, '-' + ammoSpec.damage, '#f97316');

          updateTargetCard();
          updateHUD();
          syncAttackButton();

          if (target.hp <= 0) {
            scene.remove(target.sprite);
            enemies = enemies.filter(e => e.id !== target.id);
            selectedEnemyId = null;
            isAttacking = false;
            player.exp += 35;
            player.score += 5000;
            if (player.exp >= player.maxExp) {
              player.level++;
              player.exp -= player.maxExp;
              player.maxExp = Math.round(player.maxExp * 1.4);
              player.maxHp += 200000;
              player.hp = player.maxHp;
            }
            updateTargetCard();
            updateHUD();
            syncAttackButton();
          }
        }, false);

      }
    } else if (player.ammo[ammoKey] <= 0) {
      isAttacking = false;
      syncAttackButton();
    }
  }

  renderer.render(scene, camera);
  drawMinimap();
}

function drawMinimap() {
  const w = miniCanvas.width, h = miniCanvas.height;
  mctx.clearRect(0, 0, w, h);

  mctx.fillStyle = '#e7d5b5';
  mctx.fillRect(0, 0, w, h);

  mctx.strokeStyle = 'rgba(120, 53, 15, 0.18)';
  mctx.lineWidth = 1;
  mctx.beginPath();
  mctx.moveTo(w / 2, 0); mctx.lineTo(w / 2, h);
  mctx.moveTo(0, h / 2); mctx.lineTo(w, h / 2);
  mctx.stroke();

  if (!player) return;
  const scale = w / WORLD_SIZE;
  const cx = w / 2, cy = h / 2;

  mctx.fillStyle = '#3f6212';
  gameIslands.forEach(isl => {
    mctx.beginPath();
    mctx.arc(cx + isl.mesh.position.x * scale, cy + isl.mesh.position.z * scale, 2.5, 0, Math.PI * 2);
    mctx.fill();
  });

  mctx.fillStyle = '#dc2626';
  enemies.forEach(en => {
    mctx.beginPath();
    mctx.arc(cx + en.x * scale, cy + en.z * scale, 2.2, 0, Math.PI * 2);
    mctx.fill();
  });

  mctx.fillStyle = '#22c55e';
  mctx.beginPath();
  mctx.arc(cx + player.x * scale, cy + player.z * scale, 3.2, 0, Math.PI * 2);
  mctx.fill();
}

function updateHUD() {
  scoreEl.textContent = formatShortNumber(player.score);
  levelEl.textContent = player.level;
  
  hpTextEl.textContent = `Can ${Math.ceil(player.hp).toLocaleString()} / ${player.maxHp.toLocaleString()}`;
  expTextEl.textContent = `Deneyim ${player.exp.toLocaleString()} / ${player.maxExp.toLocaleString()}`;
  
  hpBarEl.style.width = ((player.hp / player.maxHp) * 100) + '%';
  expBarEl.style.width = ((player.exp / player.maxExp) * 100) + '%';
  marketGoldEl.textContent = formatShortNumber(player.score);

  const hpPercent = Math.max(0, Math.min(100, (player.hp / player.maxHp) * 100));
  playerShipHpFillEl.style.width = hpPercent + '%';
  if (hpPercent > 50) {
    playerShipHpFillEl.style.backgroundColor = '#22c55e';
  } else if (hpPercent > 20) {
    playerShipHpFillEl.style.backgroundColor = '#eab308';
  } else {
    playerShipHpFillEl.style.backgroundColor = '#ef4444';
  }

  Object.keys(qtyEls).forEach(type => {
    const qty = player.ammo[type] || 0;
    qtyEls[type].textContent = formatShortNumber(qty);
    const slotEl = document.querySelector(`.ammo-slot[data-type="${type}"]`);
    if (slotEl) slotEl.classList.toggle('empty', qty <= 0);
  });
}

function renderShipyardList() {
  shipyardListEl.innerHTML = '';
  const owned = currentUser.ownedShips || ['standard'];
  const equipped = currentUser.equippedShip || 'standard';

  Object.values(SHIP_MODELS).forEach(model => {
    const isOwned = owned.includes(model.id);
    const isEquipped = equipped === model.id;

    const div = document.createElement('div');
    div.className = 'market-item';
    
    let btnHtml = '';
    if (isEquipped) {
      btnHtml = `<button class="buy-btn equipped" type="button" disabled>Kullanımda</button>`;
    } else if (isOwned) {
      btnHtml = `<button class="buy-btn ship-equip-btn" type="button" data-id="${model.id}">Kullan</button>`;
    } else {
      btnHtml = `<button class="buy-btn ship-buy-btn" type="button" data-id="${model.id}" data-cost="${model.cost}">Satın Al (${formatShortNumber(model.cost)})</button>`;
    }

    div.innerHTML = `
      <div class="market-item-info">
        <span class="market-item-title">${model.name}</span>
        <span class="market-item-sub">${model.desc}</span>
      </div>
      ${btnHtml}
    `;
    shipyardListEl.appendChild(div);
  });

  shipyardListEl.querySelectorAll('.ship-buy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const shipId = btn.dataset.id;
      const cost = parseInt(btn.dataset.cost);
      if (player.score < cost) {
        marketFeedbackEl.style.color = '#f87171';
        marketFeedbackEl.textContent = 'Yeterli altın yok!';
        setTimeout(() => { marketFeedbackEl.textContent = ''; }, 2000);
        return;
      }
      player.score -= cost;
      if (!currentUser.ownedShips.includes(shipId)) currentUser.ownedShips.push(shipId);
      currentUser.equippedShip = shipId;

      const users = loadUsers();
      const uIdx = users.findIndex(u => u.username.toLowerCase() === currentUser.username.toLowerCase());
      if (uIdx !== -1) {
        users[uIdx].ownedShips = currentUser.ownedShips;
        users[uIdx].equippedShip = shipId;
        saveUsers(users);
      }
      localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(currentUser));

      shipTitleEl.textContent = SHIP_MODELS[shipId].name;
      updateHUD();
      renderShipyardList();

      marketFeedbackEl.style.color = '#4ade80';
      marketFeedbackEl.textContent = `${SHIP_MODELS[shipId].name} satın alındı ve kuşanıldı!`;
      setTimeout(() => { marketFeedbackEl.textContent = ''; }, 2000);
    });
  });

  shipyardListEl.querySelectorAll('.ship-equip-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const shipId = btn.dataset.id;
      currentUser.equippedShip = shipId;

      const users = loadUsers();
      const uIdx = users.findIndex(u => u.username.toLowerCase() === currentUser.username.toLowerCase());
      if (uIdx !== -1) {
        users[uIdx].equippedShip = shipId;
        saveUsers(users);
      }
      localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(currentUser));

      shipTitleEl.textContent = SHIP_MODELS[shipId].name;
      renderShipyardList();

      marketFeedbackEl.style.color = '#4ade80';
      marketFeedbackEl.textContent = `${SHIP_MODELS[shipId].name} kuşanıldı!`;
      setTimeout(() => { marketFeedbackEl.textContent = ''; }, 2000);
    });
  });
}

loadUsers();
const session = JSON.parse(localStorage.getItem(SESSION_STORAGE_KEY) || 'null');
if (session) { completeLogin(session); }
</script>
</body>
</html>
